function docChip(fileId, fileName) {
  if (!isFileId(fileId)) return "";
  return `<span class="link-chip" data-testid="question-document">${glyph("document")} <a href="${esc(files.url(fileId))}" target="_blank" rel="noopener">${esc(fileName || "Document")}</a> <button type="button" class="btn btn-xs btn-ghost" data-action="q-remove-doc" aria-label="Remove the document">×</button></span>`;
}

// The document is uploaded at once and named by the question when it saves.
// One uploaded in this dialog that the saved question does not name (replaced,
// removed, left unsaved, or the step saved as another type) is deleted here:
// the hub reclaims a file only when a row that named it changes, so nothing
// else ever would. One a saved question already named is reclaimed by the hub
// when that question stops naming it.
async function uploadDocument(input) {
  const host = modalEl;
  const file = input.files?.[0];
  if (!host || !file) return;
  const errEl = host.querySelector("#modal-error");
  input.disabled = true;
  host.dataset.uploading = "1";
  try {
    const reply = await files.upload(file);
    if (modalEl !== host) { files.delete(reply.id).catch(() => {}); return; }
    dropDialogUpload(host);
    Object.assign(host.dataset, { fileId: reply.id, fileName: String(reply.name || file.name).slice(0, 200), uploadedFileId: reply.id });
    host.querySelector("#q-doc").innerHTML = docChip(host.dataset.fileId, host.dataset.fileName);
    if (errEl) errEl.textContent = "";
  } catch (e) {
    console.error(e);
    if (errEl && modalEl === host) errEl.textContent = uploadFailureLine(e);
  } finally {
    delete host.dataset.uploading;
    input.disabled = false;
    input.value = "";
  }
}

function dropDialogUpload(host) {
  const up = host.dataset.uploadedFileId;
  if (up && isFileId(up)) files.delete(up).catch(() => {});
  host.dataset.uploadedFileId = "";
}

/** After any failed save, the stored row is the truth. It decides three things:
 *  whether the dialog's upload is named (and so must outlive the dialog),
 *  whether this dialog's own write landed (so the next Save is not refused as
 *  someone else's change), and what the page shows for the question. Nothing
 *  reclaims a file no row ever named, so an upload the row does not name stays
 *  marked and closing deletes it. The read is the best evidence the page has,
 *  not proof: a write still in flight at the hub can land after it. A failed
 *  read keeps the file, since a stray file is cheaper than a question pointing
 *  at a deleted one. */
async function settleFailedSave(host, existingId, formId, v) {
  const rowId = existingId || host.dataset.rowId;
  if (!DB || !rowId) return;
  let row;
  try { row = (await db(`SELECT * FROM app_forms__questions WHERE id = ?`, [rowId])).rows?.[0] ?? null; }
  catch (e) { console.error(e); host.dataset.uploadedFileId = ""; return; }
  if (!row) return;
  if (row.file_id === host.dataset.uploadedFileId) host.dataset.uploadedFileId = "";
  if (!existingId) {
    // An add that landed: from here the dialog edits that row, so the next
    // Save takes the guarded edit path, never a second insert or the cap.
    // Guarded on what the dialog shows: a row naming another document (one
    // another builder saved since) refuses, so a reclaimed file is never
    // written back.
    const btn = host.querySelector("[data-action=save-q]");
    if (btn) btn.dataset.id = row.id;
    const title = host.querySelector(".modal-header h2");
    if (title) title.textContent = "Edit question";
    delete host.dataset.rowId;
    host.dataset.openedFileId = v.file_id ?? "";
  } else if ((row.file_id ?? null) === (v.file_id ?? null)) {
    // The row names what this dialog saved: the write was ours, so the guard
    // moves to it. A row naming anything else keeps refusing, so a stale
    // dialog can never write back a document the hub has reclaimed.
    host.dataset.openedFileId = row.file_id ?? "";
  }
  const list = questionsByForm.get(formId) ?? [];
  questionsByForm.set(formId, list.some(q => q.id === row.id) ? list.map(q => q.id === row.id ? row : q) : [...list, row]);
  render();
}

/** The line for a question write refused because its form is no longer a draft. */
async function frozenLine(formId) {
  const status = (await db(`SELECT status FROM app_forms__forms WHERE id = ?`, [formId]).catch(() => null))?.rows?.[0]?.status;
  return status && status !== "draft" ? "This form has been opened, so its questions can no longer change." : null;
}

const questionValues = (v) => [v.type, v.label, v.help, v.required, v.options, v.body, v.link_url, v.file_id, v.file_name];

async function saveQuestion(existingId, formId) {
  const host = modalEl;
  const errEl = host?.querySelector("#modal-error");
  const draft = questionDraft({
    type: host.querySelector("#q-type")?.value,
    label: host.querySelector("#q-label")?.value,
    help: host.querySelector("#q-help")?.value,
    required: host.querySelector("#q-required")?.checked ? 1 : 0,
    options: host.querySelector("#q-options")?.value,
    body: host.querySelector("#q-body")?.value,
    link_url: host.querySelector("#q-link")?.value,
    file_id: host.dataset.fileId,
    file_name: host.dataset.fileName,
  });
  if (host.dataset.uploading) { if (errEl) errEl.textContent = "Wait for the document to finish uploading."; return; }
  if (host.dataset.saving) return;
  if (draft.error) { if (errEl) errEl.textContent = draft.error; return; }
  if (!questionsByForm.has(formId) || questionsFailed.has(formId)) { if (errEl) errEl.textContent = "Couldn’t load the questions. Close this and try again."; return; }
  const btn = host.querySelector("[data-action=save-q]");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  host.dataset.saving = "1";
  const fileInput = host.querySelector("#q-file");
  if (fileInput) fileInput.disabled = true;
  const v = draft.value;
  const list = questionsByForm.get(formId);
  try {
    if (existingId) {
      // Guarded on the document the dialog opened with: a stale dialog would
      // otherwise write back a file another builder replaced, which the hub
      // has already deleted.
      const { changed } = await db(
        `UPDATE app_forms__questions SET type = ?, label = ?, help = ?, required = ?, options = ?, body = ?, link_url = ?, file_id = ?, file_name = ? WHERE id = ? AND file_id IS ?`,
        [...questionValues(v), existingId, host.dataset.openedFileId || null],
      );
      if (DB && Number(changed ?? 0) === 0) {
        const now = (await db(`SELECT file_id FROM app_forms__questions WHERE id = ?`, [existingId]).catch(() => null))?.rows;
        const row = now?.[0];
        // Its document changed since this dialog opened: someone else saved.
        // Otherwise the form opened and froze its questions, or the write was refused.
        const guarded = !!row && (row.file_id ?? "") !== host.dataset.openedFileId;
        if (row && !guarded) { const frozen = await frozenLine(formId); if (frozen) throw userError(frozen); }
        throw userError(failureLine(null, { action: "save the question", thing: "question", found: now ? !!row : null, guarded }));
      }
      questionsByForm.set(formId, list.map(q => q.id === existingId ? { ...q, ...v } : q));
    } else {
      if (list.length >= MAX_QUESTIONS) throw userError(`A form can have at most ${MAX_QUESTIONS} questions.`);
      const id = host ? (host.dataset.rowId ||= crypto.randomUUID()) : crypto.randomUUID();
      const position = list.reduce((max, q) => Math.max(max, Number(q.position) || 0), -1) + 1;
      try {
        await db(
          `INSERT INTO app_forms__questions (id, form_id, position, type, label, help, required, options, body, link_url, file_id, file_name) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
          [id, formId, position, ...questionValues(v)],
        );
      } catch (e) {
        if (!outcomeUnknown(e)) {
          if (e?.status === 403) { const frozen = await frozenLine(formId); if (frozen) throw userError(frozen); }
          throw e;
        }
        const stored = (await db(`SELECT id FROM app_forms__questions WHERE id = ?`, [id])).rows?.[0];
        if (!stored) {
          // Another builder took this position a moment ago: show their
          // question, and the next Add takes the place after it.
          if (/UNIQUE constraint failed/i.test(String(e?.message ?? "")) || e?.code === "UNIQUE_CONSTRAINT") {
            await loadQuestions(formId).then(() => render()).catch(err => console.error(err));
            throw userError("Another question was added at the same time. Press Add again.");
          }
          throw e;
        }
        // An earlier try of this add landed. The dialog may have changed
        // since, so the row takes what it shows now; the hub reclaims a
        // document the earlier try named and this one does not.
        const { changed } = await db(
          `UPDATE app_forms__questions SET type = ?, label = ?, help = ?, required = ?, options = ?, body = ?, link_url = ?, file_id = ?, file_name = ? WHERE id = ?`,
          [...questionValues(v), id],
        );
        if (DB && Number(changed ?? 0) === 0) throw userError((await frozenLine(formId)) ?? failureLine(null, { action: "save the question", thing: "question", found: true }));
      }
      const saved = { id, form_id: formId, position, ...v };
      questionsByForm.set(formId, list.some(q => q.id === id) ? list.map(q => q.id === id ? { ...q, ...v } : q) : [...list, saved]);
      if (host) delete host.dataset.rowId;
    }
    // Saved. An upload the row names must outlive the dialog; one it does not
    // (the step was saved as another type) is named by nothing, so it goes.
    if (v.file_id && v.file_id === host.dataset.uploadedFileId) host.dataset.uploadedFileId = "";
    else dropDialogUpload(host);
    delete host.dataset.saving;
    closeModal(host);
    render();
  } catch (e) {
    console.error(e);
    try {
      await settleFailedSave(host, existingId, formId, v);
    } catch (settleErr) {
      console.error(settleErr);
    } finally {
      // Released whatever happened above: a lock left set would leave every
      // control on the page dead until a reload.
      delete host.dataset.saving;
      if (fileInput) fileInput.disabled = false;
      if (btn) { btn.disabled = false; btn.textContent = btn.dataset.id ? "Save" : "Add"; }
    }
    if (errEl) errEl.textContent = failureLine(e, { action: "save the question", thing: "question" });
  }
}

async function moveQuestion(id, dir) {
  const form = formById(forms, view.id);
  if (!form) return;
  const list = [...(questionsByForm.get(form.id) ?? [])];
  const i = list.findIndex(q => q.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  const a = list[i], b = list[j];
  try {
    // All or nothing, and only from the positions this tab saw. Each step is
    // guarded on the stored position, so a stale tab (another builder moved a
    // question) or a frozen form (opened in another tab) changes nothing, and
    // requireChanges rolls the whole swap back with a 409. Positions are
    // UNIQUE per form, so the swap goes through a free one: a random negative
    // place, never a question's, and not one another builder's swap at the
    // same moment would pick too.
    const parked = -1 - Math.floor(Math.random() * 1e9);
    const move = `UPDATE app_forms__questions SET position = ? WHERE id = ? AND position = ?`;
    await dbBatch([
      { sql: move, params: [parked, a.id, a.position], requireChanges: true },
      { sql: move, params: [a.position, b.id, b.position], requireChanges: true },
      { sql: move, params: [b.position, a.id, parked], requireChanges: true },
    ]);
    const pa = a.position;
    a.position = b.position; b.position = pa;
    list.sort((x, y) => (x.position - y.position) || String(x.id).localeCompare(String(y.id)));
    questionsByForm.set(form.id, list);
    render();
  } catch (e) {
    console.error(e);
    // Whatever happened, the stored order is the truth: show it.
    await loadQuestions(form.id).then(() => render()).catch(err => console.error(err));
    // A position taken under this tab is someone else's reorder, not a
    // duplicate question.
    const conflict = e?.status === 409 || e?.code === "UNIQUE_CONSTRAINT" || /UNIQUE constraint failed/i.test(String(e?.message ?? ""));
    const frozen = conflict ? await frozenLine(form.id) : null;
    hubAlert(frozen ?? failureLine(conflict ? null : e, { action: "reorder the questions", thing: "question", found: conflict ? true : undefined, guarded: conflict }));
  }
}

async function deleteQuestion(id) {
  const form = formById(forms, view.id);
  if (!form) return;
  const ok = await hubConfirm({ message: "Remove this question?", confirmLabel: "Remove", destructive: true });
  if (!ok) return;
  try {
    const { changed } = await db(`DELETE FROM app_forms__questions WHERE id = ?`, [id]);
    if (DB && Number(changed ?? 0) === 0) throw userError(failureLine(null, { action: "remove the question", thing: "question", found: true }));
    questionsByForm.set(form.id, (questionsByForm.get(form.id) ?? []).filter(q => q.id !== id));
    render();
  } catch (e) { console.error(e); hubAlert(failureLine(e, { action: "remove the question", thing: "question" })); }
}

// ── Form lifecycle ───────────────────────────────────────────────────────────

async function openFormToAudience(id) {
  const form = formById(forms, id);
  if (!form || form.status !== "draft") return;
  let questions;
  try {
    questions = await loadQuestions(id);
    questionsFailed.delete(id);
  } catch (e) {
    console.error(e);
    questionsFailed.add(id);
    render();
    hubAlert("Couldn’t load the questions. Try again.");
    return;
  }
  if (questions.length === 0) { hubAlert("Add at least one question before opening the form."); return; }
  const ids = audienceIds(form, ctx());
  const ok = await hubConfirm({
    message: `Open this form to ${audiencePhrase(form)}?`,
    description: `${ids.length === 0 ? "Nobody is in its audience, so nobody will be told." : `${ids.length} ${ids.length === 1 ? "person" : "people"} will be told.`} The questions${Number(form.requires_signature) ? " and the signature statement" : ""} can no longer be changed.`,
    confirmLabel: "Open form",
  });
  if (!ok) return;
  const now = new Date().toISOString();
  // The stored row once the open is settled: the hub stamps the end of any
  // closed spell (END_CLOSED_SPELL), so its values are the ones held here.
  let stored = null;
  try {
    const { changed } = await db(OPEN_FORM_SQL, [now, now, id]);
    if (DB && Number(changed ?? 0) === 0) {
      // Already open: this tab's earlier try landed with its answer lost, or
      // another builder opened it a moment ago. Either way it is open, and the
      // rest runs; the notification below is keyed per form, so the audience
      // is told once whoever gets here.
      stored = (await db(`SELECT * FROM app_forms__forms WHERE id = ?`, [id])).rows?.[0] ?? null;
      if (stored) Object.assign(form, stored);
      if (stored?.status !== "open") throw userError(failureLine(null, { action: "open the form", thing: "form", found: !!stored, guarded: true }));
    }
  } catch (e) {
    console.error(e);
    // The form row may have been re-read into a state the page no longer shows.
    render();
    hubAlert(failureLine(e, { action: "open the form", thing: "form" }));
    return;
  }
  // Opened. From here nothing may report the open as failed. Without the
  // stored row, the page's copy of the statement stands until the read-back
  // below lands, or until the next load if it fails.
  if (!stored) {
    Object.assign(form, { status: "open", opened_at: now, closes_at: null, closed_at: null, closed_windows: endClosedSpell(form, now), updated_at: now });
    if (DB) {
      const again = (await db(`SELECT * FROM app_forms__forms WHERE id = ?`, [id]).catch(err => { console.error(err); return null; }))?.rows?.[0];
      if (again) Object.assign(form, again);
    }
  }
  render();
  // One line at the end says everything that went wrong after the open, so a
  // later message never hides an earlier one.
  const problems = [];
  // Side effects, together and after the UI moved: a slow send never delays
  // the activity line, and a failed one never loses it.
  const audience = notifyAudience(form, ctx());
  const url = hubAppUrl(APP_ID, { formId: id });
  const results = await Promise.allSettled([
    audience === null ? Promise.resolve("nobody") : sendHubNotification({
      title: `New form: ${form.title}`,
      body: form.due_date ? `Please fill it in by ${formatDay(form.due_date)}.` : "Please fill it in when you can.",
      audience,
      url,
      idempotencyKey: `form-open:${id}`,
    }),
    logHubActivity(`${ME?.name ?? "Someone"} opened the form "${form.title}"`, { url }),
  ]);
  const sent = results[0];
  if (audience === null) problems.push("nobody in its audience can be notified");
  else if (sent.status !== "fulfilled" || !sent.value) problems.push("the notification could not be sent");
  if (results[1].status === "rejected") console.error(results[1].reason);
  if (problems.length) toast(`Form opened, but ${problems.join(", and ")}.`);
}

async function transitionForm(id, sql, expectFrom, patch, words) {
  const form = formById(forms, id);
  if (!form || form.status !== expectFrom) return;
  const now = new Date().toISOString();
  try {
    const { changed } = await db(sql, [now, id]);
    if (DB && Number(changed ?? 0) === 0) {
      const again = (await db(`SELECT * FROM app_forms__forms WHERE id = ?`, [id])).rows?.[0];
      if (again && again.status === patch.status) Object.assign(form, again);
      else throw userError(failureLine(null, { action: words.action, thing: "form", found: !!again, guarded: true }));
    } else {
      Object.assign(form, patch, { updated_at: now });
      // A close or reopen stamps its times from the hub's clock, and the
      // review list compares them with copies stamped by the same clock: hold
      // the stored values. If this read fails, a close shows no close time
      // rather than this device's guess, and a reopen keeps the spell it
      // ended (ended at this device's time) until the next load.
      if (DB) {
        const again = (await db(`SELECT * FROM app_forms__forms WHERE id = ?`, [id]).catch(err => { console.error(err); return null; }))?.rows?.[0];
        if (again) Object.assign(form, again);
      }
    }
    if (patch.status === "archived" && view.kind === "form") {
      closeForm();
      currentTab = "archived";
      if (!archivedLoaded) loadArchived().then(render).catch(err => { console.error(err); toast("Couldn’t load archived forms."); });
    }
    render();
  } catch (e) { console.error(e); hubAlert(failureLine(e, { action: words.action, thing: "form" })); }
}

async function deleteDraft(id) {
  const form = formById(forms, id);
  if (!form || form.status !== "draft") return;
  const ok = await hubConfirm({ message: "Delete this draft?", description: `"${form.title}" and its questions will be removed.`, confirmLabel: "Delete", destructive: true });
  if (!ok) return;
  try {
    const { changed } = await db(`DELETE FROM app_forms__forms WHERE id = ? AND status = 'draft'`, [id]);
    if (DB && Number(changed ?? 0) === 0) {
      const again = (await db(`SELECT id FROM app_forms__forms WHERE id = ?`, [id])).rows?.[0];
      throw userError(failureLine(null, { action: "delete the draft", thing: "form", found: !!again, guarded: true }));
    }
    forms = forms.filter(f => f.id !== id);
    questionsByForm.delete(id);
    closeForm();
  } catch (e) { console.error(e); hubAlert(failureLine(e, { action: "delete the draft", thing: "form" })); }
}

// ── Filling in ───────────────────────────────────────────────────────────────

function collectAnswers(formId) {
  const host = document.getElementById("fill-form");
  // Only inputs drawn for THIS form and THIS fill state are read: right after
  // switching forms the previous form's inputs are still on screen, and its
  // questions are not this form's. Without them, what is held stands.
  const questions = questionsByForm.get(formId);
  if (!host || host.dataset.formId !== formId || fillState.formId !== formId || !questions) return fillState.answers;
  const raw = {};
  for (const q of questions) {
    const els = host ? [...host.querySelectorAll(`[data-q="${CSS.escape(q.id)}"]`)] : [];
    if (q.type === "multi") raw[q.id] = els.filter(el => el.checked).map(el => el.value);
    else if (q.type === "choice" || q.type === "yesno") raw[q.id] = els.find(el => el.checked)?.value ?? "";
    else if (q.type === "read") raw[q.id] = !!els[0]?.checked;
    else if (q.type === "file") raw[q.id] = fillState.answers[q.id] ?? null;
    else raw[q.id] = els[0]?.value ?? "";
  }
  fillState.answers = raw;
  const sigName = host?.querySelector("#sig-name");
  const sigAgree = host?.querySelector("#sig-agree");
  if (sigName) fillState.signature.name = sigName.value;
  if (sigAgree) fillState.signature.agreed = !!sigAgree.checked;
  return raw;
}

async function ensureDraftRow(form) {
  let sub = mySubmission(mine, form.id, ME.id);
  if (sub) return sub;
  const now = new Date().toISOString();
  const id = crypto.randomUUID();
  const revision = crypto.randomUUID();
  sentRevisions.add(revision);
  try {
    await db(
      `INSERT INTO app_forms__submissions (id, form_id, member_id, status, answers, signed_name, signed_at, terms_hash, submitted_at, created_at, updated_at, revision) VALUES (?, ?, ?, 'draft', '{}', '', NULL, '', NULL, ?, ?, ?)`,
      [id, form.id, ME.id, now, now, revision],
    );
  } catch (e) {
    // A draft may already exist (another tab, a lost answer): read it back.
    if (!outcomeUnknown(e) && e?.status !== 403) throw e;
    sub = await loadMineFor(form.id);
    if (!sub) throw e;
    // Our own insert, whose answer was lost: carry on with it. Anyone else's
    // was saved by another tab or device, which this page has never seen.
    // Writing over it would drop its answers and files: take it instead.
    if (sub.id !== id) {
      if (sub.status === "submitted") throw userError("This form was already submitted.");
      adoptStoredDraft(form, sub);
    }
    // Ours, but the answers rest on the row as the insert wrote it, not as it
    // reads now: another tab may have opened it and saved since. Any such
    // save is taken rather than written over.
    draftBases.set(form.id, revision);
    if (reconcileStoredDraft(form, sub)) throw Object.assign(userError(STALE_DRAFT), { adopted: true });
    return sub;
  }
  draftBases.set(form.id, revision);
  sub = { id, form_id: form.id, member_id: ME.id, status: "draft", answers: "{}", signed_name: "", signed_at: null, terms_hash: "", submitted_at: null, created_at: now, updated_at: now, revision };
  mine = [sub, ...mine];
  return sub;
}

// Every draft write, one after another. Each is guarded on the revision the
// one before it wrote, so two in flight at once would refuse each other.
let draftWrites = Promise.resolve();
// Bumped whenever the page takes the stored draft over its own. A write or a
// submit queued before that holds answers from before it, and would write
// them over the stored files with a revision that now matches.
// Kept per form: taking one form's stored draft says nothing about another's.
const draftEpochs = new Map();
const draftEpoch = (formId) => draftEpochs.get(formId) ?? 0;
// Every change to a form's stored draft this page knows of: each write that
// landed, and each stored draft it took. A submit checks it has not moved
// since the answers it is about to sign were read.
const draftVersions = new Map();
const draftVersion = (formId) => draftVersions.get(formId) ?? 0;
const bumpDraftVersion = (formId) => draftVersions.set(formId, draftVersion(formId) + 1);

/** Runs `work` after every draft write already queued, and holds the queue
 *  until it settles. */
function queueDraftWork(work) {
  const run = draftWrites.then(work);
  draftWrites = run.catch(() => {});
  return run;
}

// The stored draft each form's held answers rest on, by its revision: set
// when the page loads, saves or takes a draft, and by nothing else. Every
// save and submit is guarded on it. The row in `mine` is not enough: any read
// refreshes it, and a guard on a refreshed row would let answers from before
// another tab's save write over that save, and drop its answers and files.
const draftBases = new Map();
// The revisions this page has written: a read that finds one stored knows
// the write was its own, whose answer was lost. Random, so never another's.
const sentRevisions = new Set();
const revisionOf = (row) => row?.revision ?? "";

/** Makes the stored draft the one the page's answers rest on: its answers
 *  replace the held ones, and writes and submits queued before this stop. */
function takeStoredDraft(form, stored) {
  draftEpochs.set(form.id, draftEpoch(form.id) + 1);
  bumpDraftVersion(form.id);
  draftBases.set(form.id, revisionOf(stored));
  if (fillState.formId === form.id) {
    // A file held here that the stored draft does not name is let go: nothing
    // else would ever delete it. The hub refuses (403) while any row names it.
    const kept = new Set(parseStrings(stored.file_ids));
    for (const answer of Object.values(fillState.answers)) {
      const id = attachedFile(answer)?.file_id;
      if (id && !kept.has(id)) files.delete(id).catch(() => {});
    }
    fillState.answers = parseObject(stored.answers);
  }
}

/** takeStoredDraft, then the line to show, thrown. */
function adoptStoredDraft(form, stored) {
  takeStoredDraft(form, stored);
  throw Object.assign(userError(STALE_DRAFT), { adopted: true });
}

/** After the stored draft is read outside a write (a failed save's
 *  recovery): if it is not the draft the answers rest on, a write landed.
 *  The page's own, whose answer was lost, now becomes the base. Anyone
 *  else's is taken. True when another's was taken. */
function reconcileStoredDraft(form, stored) {
  if (!stored || stored.status !== "draft" || revisionOf(stored) === draftBases.get(form.id)) return false;
  if (sentRevisions.has(revisionOf(stored))) {
    draftBases.set(form.id, revisionOf(stored));
    bumpDraftVersion(form.id);
    return false;
  }
  takeStoredDraft(form, stored);
  return true;
}

/** Writes the held answers to the draft, with the files they name, after any
 *  write already queued. The answers are taken now, so the last write queued
 *  holds everything attached before it. This never runs without the form's
 *  questions: without them no file would be named, and every attached file
 *  would go. */
function writeDraft(form) {
  const questions = questionsFailed.has(form.id) ? null : questionsByForm.get(form.id);
  if (!questions) return Promise.reject(userError("Couldn’t load this form’s questions. Try again."));
  const held = { ...fillState.answers };
  const epoch = draftEpoch(form.id);
  return queueDraftWork(async () => {
    if (epoch !== draftEpoch(form.id)) throw Object.assign(userError(STALE_DRAFT), { adopted: true });
    const sub = await ensureDraftRow(form);
    const expected = draftBases.get(form.id);
    // A stored draft the held answers were never based on (it arrived after
    // the form was opened): take it rather than write over it.
    if (expected === undefined) adoptStoredDraft(form, sub);
    const now = new Date().toISOString();
    const revision = crypto.randomUUID();
    sentRevisions.add(revision);
    const answers = JSON.stringify(held);
    const fileIds = JSON.stringify(answerFileIds(questions, held));
    let changed;
    try {
      ({ changed } = await db(SAVE_DRAFT_SQL, [answers, fileIds, now, revision, sub.id, expected]));
    } catch (e) {
      // Only the answer may have been lost: if the stored draft carries this
      // write's revision, it landed.
      if (!outcomeUnknown(e)) throw e;
      const stored = await loadMineFor(form.id).catch(() => null);
      if (revisionOf(stored) !== revision) throw e;
      changed = 1;
    }
    if (DB && Number(changed ?? 0) === 0) await refusedDraftWrite(form);
    const saved = { answers, file_ids: fileIds, updated_at: now, revision };
    Object.assign(sub, saved);
    // A read that landed meanwhile may have put a fresh copy of the row in
    // `mine`, still holding the old revision: the next write must see this one.
    const current = mySubmission(mine, form.id, ME.id);
    if (current && current !== sub && current.id === sub.id) Object.assign(current, saved);
    draftBases.set(form.id, revision);
    bumpDraftVersion(form.id);
  });
}

// What a member is told when their draft was saved elsewhere since this page read it.
const STALE_DRAFT = "This draft was saved in another tab or on another device. Its attached files are shown here now: check your answers, then save or submit again.";

/** A draft write or submit that changed nothing: the copy was submitted, or
 *  another tab or device saved the draft since this page read it. The page
 *  then takes the stored draft's answers. The next redraw puts back what is
 *  typed on screen, but the files are the stored ones, so it never writes
 *  over a file attached there. Always throws, with the line to show. */
async function refusedDraftWrite(form) {
  let stored;
  try { stored = await loadMineFor(form.id); }
  catch (err) { console.error(err); throw userError("Couldn’t check this draft. Reload the page to see it."); }
  if (stored?.status === "submitted") throw userError("This form was already submitted.");
  if (!stored) throw userError("This draft has been removed.");
  if (reconcileStoredDraft(form, stored)) throw Object.assign(userError(STALE_DRAFT), { adopted: true });
  // The page's own earlier write, whose answer was lost: the base is now
  // that, and the same save will go through.
  throw userError("Couldn’t save the draft — try again.");
}

async function saveDraft(formId) {
  const form = formById(forms, formId);
  if (!form || !ME?.id || fillState.formId !== formId) return;
  collectAnswers(formId);
  if (fillState.uploading.size) { fillState.error = "Wait for the file to finish uploading."; render(); return; }
  const btn = document.querySelector('[data-testid="save-draft"]');
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  fillState.error = "";
  try {
    await writeDraft(form);
    toast("Draft saved.");
  } catch (e) {
    console.error(e);
    if (fillState.formId === formId) fillState.error = failureLine(e, { action: "save the draft", thing: "draft" });
  }
  if (view.kind === "form" && view.id === formId) render();
}

// Each question's attach and remove, in the order the member made them. A
// failed one puts back what it replaced only while it is still the latest
// thing done to that question, and no stored draft has been taken since:
// otherwise it would bring back a file the member has since moved past.
const answerEdits = new Map();
function editAnswer(formId, questionId) {
  const key = `${formId}\u0000${questionId}`;
  const version = (answerEdits.get(key) ?? 0) + 1;
  answerEdits.set(key, version);
  const epoch = draftEpoch(formId);
  return () => answerEdits.get(key) === version && draftEpoch(formId) === epoch;
}

/** Uploads a member's file into the answers scope and saves the draft naming
 *  it at once: the reviewers can open it from the moment it lands. The hub
 *  never deletes an answers file because the draft stopped naming it, so the
 *  page deletes the ones it lets go of, and the hub refuses (403) while any
 *  row still names one. */
async function attachAnswerFile(formId, questionId, input) {
  const picked = input.files?.[0];
  const form = formById(forms, formId);
  if (!picked || !form || !ME?.id || fillState.formId !== formId || fillState.uploading.has(questionId)) return;
  collectAnswers(formId);
  // Held until the draft naming the file is saved, so Save draft and Submit
  // wait for it too.
  const uploading = fillState.uploading;
  uploading.add(questionId);
  fillState.error = "";
  render();
  const here = () => fillState.formId === formId && fillState.uploading === uploading;
  let reply;
  try {
    reply = await files.upload(picked, { scope: ANSWER_FILE_SCOPE });
  } catch (e) {
    console.error(e);
    uploading.delete(questionId);
    if (here()) { fillState.error = uploadFailureLine(e, { action: "attach that file", thing: "file" }); render(); }
    return;
  }
  // The member moved to another form while it uploaded: nothing will name it.
  if (!here()) { uploading.delete(questionId); files.delete(reply.id).catch(() => {}); return; }
  const previous = fillState.answers[questionId] ?? null;
  const attached = { file_id: reply.id, name: reply.name ?? picked.name };
  fillState.answers[questionId] = attached;
  const latest = editAnswer(formId, questionId);
  try {
    await writeDraft(form);
    // A file this one replaced is let go of now that the saved draft no
    // longer names it.
    const replaced = attachedFile(previous)?.file_id;
    if (replaced && replaced !== reply.id) files.delete(replaced).catch(() => {});
    toast("File attached.");
  } catch (e) {
    console.error(e);
    // Only a save known not to have landed lets the file go: one the page
    // refused itself, or a definite error. Unknown (the answer was lost), the
    // file stays on the answer and the next save names it.
    if (e?.forUser || !outcomeUnknown(e)) {
      // Off the answer first, so no save queued from here on names it; then
      // deleted once the saves already queued have settled. It goes back
      // only when the hub refused: 403 (one of them named it after all) or
      // 409 (busy). A delete whose answer was lost may have gone through,
      // and putting a deleted file back would have the next save name it.
      if (here() && latest()) fillState.answers[questionId] = previous;
      await draftWrites;
      const refused = await files.delete(reply.id).then(() => false, (err) => err?.status === 403 || err?.status === 409);
      if (refused && here() && !e?.adopted && latest()) {
        fillState.answers[questionId] = attached;
      }
    }
    if (here()) fillState.error = e?.forUser ? e.message : failureLine(e, { action: "attach that file", thing: "draft" });
  } finally {
    uploading.delete(questionId);
  }
  if (here()) render();
}

/** Takes a file off the answer and out of the draft, then deletes it. */
async function removeAnswerFile(formId, questionId) {
  const form = formById(forms, formId);
  if (!form || fillState.formId !== formId) return;
  collectAnswers(formId);
  const previous = fillState.answers[questionId];
  if (!attachedFile(previous)) return;
  fillState.answers[questionId] = null;
  const latest = editAnswer(formId, questionId);
  fillState.error = "";
  try {
    await writeDraft(form);
    // Only once the saved draft no longer names it; the hub refuses while any
    // row does.
    files.delete(previous.file_id).catch(() => {});
    toast("File removed.");
  } catch (e) {
    console.error(e);
    // The file is still there (nothing deletes it but the page), so putting
    // it back is safe: if the removal landed after all, the next save names
    // it again. Only while this removal is still the latest thing done to
    // the question (editAnswer): an attach or remove since is newer.
    if (fillState.formId === formId) {
      if (!e?.adopted && latest()) fillState.answers[questionId] = previous;
      fillState.error = e?.forUser ? e.message : failureLine(e, { action: "remove the file", thing: "draft" });
    }
  }
  if (fillState.formId === formId) render();
}

async function submitForm(formId) {
  const form = formById(forms, formId);
  if (!form || !ME?.id || fillState.formId !== formId) return;
  if (!questionsByForm.has(formId) || questionsFailed.has(formId)) { fillState.error = "Couldn’t load this form’s questions. Try again."; render(); return; }
  const questions = questionsByForm.get(formId);
  if (questions.length === 0) { fillState.error = "This form has no questions to answer."; render(); return; }
  // Taken before the answers are: if a draft write finds the draft saved
  // elsewhere while this submit is under way, these answers predate it.
  const epoch = draftEpoch(formId);
  const version = draftVersion(formId);
  const raw = collectAnswers(formId);
  if (fillState.uploading.size) { fillState.error = "Wait for the file to finish uploading, then submit."; render(); return; }
  const checked = cleanAnswers(questions, raw);
  if (checked.error) { fillState.error = checked.error; render(); return; }
  const sig = cleanSignature(form, fillState.signature);
  if (sig.error) { fillState.error = sig.error; render(); return; }
  const signs = Number(form.requires_signature) === 1;
  const ok = await hubConfirm({
    message: signs ? "Sign and submit?" : "Submit your answers?",
    description: signs ? `Your name, the time and the statement’s wording are kept with your answers. ${form.title} cannot be changed afterwards.` : "Your answers cannot be changed afterwards.",
    confirmLabel: signs ? "Sign and submit" : "Submit",
  });
  if (!ok) return;
  const btn = document.querySelector('[data-testid="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = "Submitting…"; }
  fillState.error = "";
  try {
    // The form as it is NOW, not as this tab loaded it: a closed form takes
    // nothing, and the copy records the statement and questions on screen.
    if (DB) {
      const state = (await db(FORM_STATE_SQL, [form.id])).rows?.[0];
      if (!state) throw userError("This form has been removed.");
      if (state.status !== "open") { Object.assign(form, state); throw userError("This form is closed and no longer takes submissions."); }
      // The member agreed to the statement on screen. If the stored one now
      // reads differently, signing would record wording they never saw: show
      // the new wording and ask for the agreement again.
      if (Number(state.requires_signature) !== Number(form.requires_signature)
        || (signs && (state.signature_text ?? "") !== (form.signature_text ?? ""))) {
        Object.assign(form, { requires_signature: state.requires_signature, signature_text: state.signature_text });
        fillState.signature.agreed = false;
        const agree = document.getElementById("sig-agree");
        if (agree) agree.checked = false;
        throw userError("This form’s signature statement has changed. Read it again before you submit.");
      }
      form.signature_text = state.signature_text;
    }
    // In the draft-write queue, so no save runs while this one does. The
    // answers were checked before the confirm: if the draft has changed since
    // (a file finished attaching, a stored draft was taken), they are not
    // what is now saved, and signing them would drop what changed.
    const { sub, signedText, hash, fileIds, params, changed } = await queueDraftWork(async () => {
      if (epoch !== draftEpoch(form.id)) throw userError(STALE_DRAFT);
      if (version !== draftVersion(form.id)) {
        throw userError("Your draft changed while you were submitting. Check your answers, then submit again.");
      }
      if (fillState.formId === form.id && fillState.uploading.size) {
        throw userError("Wait for the file to finish uploading, then submit.");
      }
      const sub = await ensureDraftRow(form);
      const expected = draftBases.get(form.id);
      if (expected === undefined) adoptStoredDraft(form, sub);
      const signedText = signs ? form.signature_text : "";
      const hash = termsHash(questions, signedText);
      const fileIds = JSON.stringify(answerFileIds(questions, checked.value.answers));
      const params = [JSON.stringify(checked.value.answers), fileIds, sig.value.signed_name, signedText, hash, sub.id, expected];
      const { changed } = await db(signs ? SUBMIT_SIGNED_SQL : SUBMIT_SQL, params);
      return { sub, signedText, hash, fileIds, params, changed };
    });
    let notice = "";
    // The submitted row as stored, with the hub's times, once known.
    let stored = null;
    if (DB && Number(changed ?? 0) === 0) {
      // Nothing changed: find out why before saying anything. A retry can
      // never land on a row that is already final, so "try again" is wrong
      // whenever the check itself fails.
      let again;
      try { again = await loadMineFor(form.id); }
      catch (err) { console.error(err); throw userError("Couldn’t check whether this form was submitted. Reload the page to see."); }
      if (again?.status === "draft") {
        if (reconcileStoredDraft(form, again)) throw Object.assign(userError(STALE_DRAFT), { adopted: true });
      }
      if (again?.status !== "submitted") throw userError(failureLine(null, { action: "submit the form", thing: "submission", found: !!again, guarded: true }));
      // Submitted already, from another tab or device: that copy is the one
      // kept, and these answers were not saved.
      notice = "This form was already submitted from another tab or device. That copy is the one kept; the answers on this screen were not saved.";
      stored = again;
    } else {
      // The times were the hub's: read the stored row back for them. If that
      // read fails the copy is still final, and this tab shows its own clock
      // until the next load.
      const now = new Date().toISOString();
      Object.assign(sub, { status: "submitted", answers: params[0], file_ids: fileIds, signed_name: sig.value.signed_name, signed_at: signs ? now : null, signed_text: signedText, terms_hash: hash, submitted_at: now, updated_at: now });
      // Without a database (the demo) the local row is the stored one.
      stored = DB ? await loadMineFor(form.id).catch(err => { console.error(err); return null; }) : sub;
    }
    // A reviewer's completion list counts this copy too, with the hub's
    // times: the list compares them with the close. Without the stored row
    // it is read again rather than patched with this device's clock.
    if (submissionsByForm.has(form.id)) {
      if (stored) submissionsByForm.set(form.id, [stored, ...submissionsByForm.get(form.id).filter(s => s.id !== stored.id)]);
      else if (DB) await loadSubmissions(form.id).catch(err => console.error(err));
    }
    render();
    // Cleared after the redraw: renderFormPage reads the inputs still on
    // screen into fillState first, which would put these answers back.
    // Only if they are still this form's: the member may have opened another
    // form while this one was submitting, and its answers are now held here.
    if (fillState.formId === form.id) {
      fillState.answers = {};
      fillState.signature = { name: null, agreed: false };
    }
    if (notice) { hubAlert(notice); return; }
    logHubActivity(`${ME.name} submitted "${form.title}"`, { url: hubAppUrl(APP_ID, { formId }) }).catch(() => {});
  } catch (e) {
    console.error(e);
    // Shown only on this form: the member may have opened another meanwhile.
    if (fillState.formId === form.id) fillState.error = failureLine(e, { action: "submit the form", thing: "submission" });
    render();
  }
}

/** A signed copy is shown only against its form's questions: shown against
 *  none, every answer would be missing and the copy would read as altered. */
async function showCopy(form, sub) {
  let questions = questionsFailed.has(form.id) ? null : questionsByForm.get(form.id);
  if (!questions) {
    try { questions = await loadQuestions(form.id); questionsFailed.delete(form.id); }
    catch (e) { console.error(e); questionsFailed.add(form.id); hubAlert("Couldn’t load this form’s questions, so the copy can’t be shown. Try again."); return; }
  }
  // The load may have landed while a question was saving: opening now would
  // orphan that dialog, which cannot close mid-save.
  if (modalEl?.dataset.saving) return;
  openSubmissionModal(form, sub, questions);
}

function openSubmissionModal(form, sub, questions) {
  const answers = parseObject(sub.answers);
  const rows = [...questions].sort((a, b) => a.position - b.position).map(q => {
    const value = answers[q.id];
    const text = answerText(q, value);
    const file = q.type === "file" ? attachedFile(value) : null;
    const shown = file
      ? `<p><a class="link-chip" data-testid="answer-file" href="${esc(files.url(file.file_id))}" target="_blank" rel="noopener">${glyph("document")} ${esc(text)}</a></p>`
      : (text ? `<div class="answer">${esc(text)}</div>` : `<span class="answer none">No answer</span>`)
        + (q.type === "read" ? docLink(q) : "");
    return `<div class="question"><div class="q-label">${esc(q.label)}</div>${shown}</div>`;
  }).join("");
  const intact = submissionIntact(questions, sub);
  const terms = sub.signed_at ? `
    <div class="signature-box">
      <div class="q-label">${glyph("signature")} Signed</div>
      <div class="statement" data-testid="signed-text">${esc(sub.signed_text)}</div>
      <div class="signed-line" data-testid="signed-name">${esc(sub.signed_name)}</div>
      <p class="form-hint">${esc(memberName(sub.member_id))} · ${formatWhen(sub.signed_at)}</p>
      <p class="form-hint">Terms reference ${esc(String(sub.terms_hash).slice(0, 16))}${intact ? "" : " — the questions changed after this was signed, or the copy was altered"}</p>
    </div>` : (intact ? "" : `<p class="form-hint">The questions changed after this was submitted.</p>`);
  openModal(`
    ${modalHeader(esc(form.title))}
    <div class="modal-body" data-testid="submission-view">
      <p class="form-hint" style="margin-bottom:10px">${esc(memberName(sub.member_id))} · submitted ${sub.submitted_at ? formatWhen(sub.submitted_at) : ""}</p>
      ${form.description ? `<p class="detail-desc">${esc(form.description)}</p>` : ""}
      ${rows}
      ${terms}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-action="print">${glyph("document")} Print or save as PDF</button>
      <button class="btn btn-primary" data-action="close-modal">Close</button>
    </div>`, "submission-modal");
}

async function remind(formId) {
  const form = formById(forms, formId);
  const subs = submissionsByForm.get(formId) ?? [];
  const { outstanding } = completion(form, subs, ctx());
  if (outstanding.length === 0) return;
  const btn = document.querySelector('[data-testid="remind"]');
  if (btn) btn.disabled = true;
  const sent = await sendHubNotification({
    title: `Reminder: ${form.title}`,
    body: form.due_date ? `Please fill it in by ${formatDay(form.due_date)}.` : "Please fill it in when you can.",
    audience: outstanding,
    url: hubAppUrl(APP_ID, { formId }),
  }).catch(() => null);
  if (btn) btn.disabled = false;
  toast(sent ? `Reminded ${outstanding.length} ${outstanding.length === 1 ? "person" : "people"}.` : "The reminder could not be sent.");
}

async function deleteIntake(id) {
  const ok = await hubConfirm({ message: "Remove this submission?", confirmLabel: "Remove", destructive: true });
  if (!ok) return;
  const formId = view.id;
  try {
    const { changed } = await db(`DELETE FROM app_forms__intake WHERE id = ?`, [id]);
    if (DB && Number(changed ?? 0) === 0) throw userError(failureLine(null, { action: "remove the submission", thing: "submission", found: true }));
    intakeByForm.set(formId, (intakeByForm.get(formId) ?? []).filter(r => r.id !== id));
    render();
  } catch (e) { console.error(e); hubAlert(failureLine(e, { action: "remove the submission", thing: "submission" })); }
}

        <p class="form-hint">Members of this group can read every submitted form and see who has not submitted. Nobody else can, not even a hub admin.${TENANT.spaceKind === "roster" ? " In this space only the steward, as a member of the group, can read submissions: put yourself in it." : ""} Manage group membership in hub settings.</p>
      </div>

}

async function saveSettings() {
  const host = modalEl;
  const groupId = host?.querySelector("#rev-group")?.value ?? "";
  const btn = host?.querySelector("[data-action=save-settings]");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  try {
    const res = await fetch(ADMIN_CONFIG_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: "reviewers_group_id", value: groupId }) });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw Object.assign(new Error(err?.error ?? "Save failed"), { status: res.status, code: typeof err?.code === "string" ? err.code : undefined });
    }
    reviewersGroupId = groupId || null;
    closeModal(host);
    if (view.kind === "form" && canReview()) await loadSubmissions(view.id).catch(() => {});
    render();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Save"; }
    console.error(e);
    const errEl = host?.querySelector("#modal-error");
    if (errEl) errEl.textContent = failureLine(e, { action: "save the settings", thing: "setting" });

// ── Toast ────────────────────────────────────────────────────────────────────

let toastTimer = null;
function toast(message) {
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 5000);
}

// ── Events ───────────────────────────────────────────────────────────────────

document.addEventListener("click", (e) => {
  // A question being saved owns the screen: no other control may close it,
  // replace it or change its document until the save settles.
  if (modalEl?.dataset.saving) return;
  if (e.target.closest('[data-testid="load-retry"]')) { init(); return; }
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const id = el.dataset.id;
  const form = view.kind === "form" ? formById(forms, view.id) : null;
  switch (el.dataset.action) {
    case "archive-more": loadMore("archive", () => loadArchived({ more: true }), "Couldn’t load older archived forms."); break;
    case "tab": currentTab = id; if (id === "archived" && canManage() && !archivedLoaded) loadArchived().then(render).catch(err => { console.error(err); toast("Couldn’t load archived forms."); }); render(); break;
    case "new": openFormModal(null); break;
    case "open": openForm(id); break;
    case "back": closeForm(); break;
    case "close-modal": closeModal(); break;
    case "settings": openSettingsModal(); break;
    case "save-settings": saveSettings(); break;
    case "edit-form": openFormModal(formById(forms, id)); break;
    case "save-form": saveForm(id || null); break;
    case "add-q": openQuestionModal(id, null); break;
    case "edit-q": openQuestionModal(form.id, (questionsByForm.get(form.id) ?? []).find(q => q.id === id)); break;
    case "save-q": saveQuestion(id || null, el.dataset.form); break;
    case "remove-answer-file": if (view.kind === "form") removeAnswerFile(view.id, el.dataset.question); break;
    case "q-remove-doc": if (modalEl) { dropDialogUpload(modalEl); Object.assign(modalEl.dataset, { fileId: "", fileName: "" }); modalEl.querySelector("#q-doc").innerHTML = ""; } break;
    case "delete-q": deleteQuestion(id); break;
    case "move-q": moveQuestion(id, Number(el.dataset.dir)); break;
    case "open-form": openFormToAudience(id); break;
    case "close-form": transitionForm(id, CLOSE_FORM_SQL, "open", { status: "closed" }, { action: "close the form" }); break;
    case "reopen-form": transitionForm(id, REOPEN_FORM_SQL, "closed", { status: "open", closes_at: null, closed_at: null, closed_windows: endClosedSpell(form, new Date().toISOString()) }, { action: "reopen the form" }); break;
    case "archive-form": hubConfirm({ message: "Archive this form?", description: "It leaves the list and every intake link stops. Submissions are kept.", confirmLabel: "Archive", destructive: true }).then(ok => { if (ok) transitionForm(id, ARCHIVE_FORM_SQL, form.status, { status: "archived" }, { action: "archive the form" }); }); break;
    case "delete-form": deleteDraft(id); break;
    case "share": if (form) shareUi.open({ id: form.id, title: form.title }); break;
    case "save-draft": saveDraft(id); break;
    case "submit": submitForm(id); break;
    case "retry-questions": openForm(id); break;
    case "view-mine": { const sub = mySubmission(mine, id, ME?.id); if (sub && form) showCopy(form, sub); break; }
    case "view-sub": { const sub = (submissionsByForm.get(form?.id) ?? []).find(s => s.id === id); if (sub && form) showCopy(form, sub); break; }
    case "remind": remind(id); break;
    case "delete-intake": deleteIntake(id); break;
    case "intake-more": loadMore(`intake:${id}`, () => loadIntake(id, { more: true }), "Couldn’t load older submissions."); break;
    case "print": window.print(); break;
  }
});

// ── Demo data ────────────────────────────────────────────────────────────────

function loadDemoData() {
  const now = new Date();
  const iso = (d) => new Date(now.getTime() - d * 86400000).toISOString();
  const demoQuestions = [
    { id: "q1", form_id: "demo-1", position: 0, type: "read", label: "Pool rules", help: "", required: 1, options: "[]", body: "No glass on the deck. Children under 12 must be with an adult. The gate closes at 9pm.", link_url: "" },
    { id: "q2", form_id: "demo-1", position: 1, type: "text", label: "Emergency contact", help: "A name and number", required: 1, options: "[]", body: "", link_url: "" },
    { id: "q3", form_id: "demo-1", position: 2, type: "yesno", label: "Can your child swim unassisted?", help: "", required: 1, options: "[]", body: "", link_url: "" },
  ];
  forms = [
    { id: "demo-1", title: "Pool waiver 2026", description: "Read the rules and sign before the season starts.", status: "open", audience_kind: "everyone", audience_group_id: null, audience_member_ids: "[]", requires_signature: 1, signature_text: "I have read the pool rules and accept them on behalf of my household.", due_date: hubToday(new Date(now.getTime() + 10 * 86400000)), closes_at: null, created_by: "demo-1", created_at: iso(3), updated_at: iso(3), opened_at: iso(2), closed_at: null },
    { id: "demo-2", title: "Welcome packet", description: "For new families: the handbook, the photo consent and a few questions.", status: "draft", audience_kind: "group", audience_group_id: "g-board", audience_member_ids: "[]", requires_signature: 1, signature_text: "I have read the handbook.", due_date: null, closes_at: null, created_by: "demo-1", created_at: iso(1), updated_at: iso(1), opened_at: null, closed_at: null },
  ];
  questionsByForm.set("demo-1", demoQuestions);
  questionsByForm.set("demo-2", []);
  mine = [];
}

// ── Deep link ────────────────────────────────────────────────────────────────

function handleDeepLink() {
  const formId = new URLSearchParams(window.location.search).get("formId");
  if (formId && formById(forms, formId)) openForm(formId);
}

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  if (!DB) {
    await loadMembers();
    ME = resolveCurrentMember(window.__CURRENT_MEMBER, members, IN_HUB);
    loadDemoData();
    render();
    handleDeepLink();
    return;
  }
  try {
    await Promise.all([loadMembers(), loadSettings()]);
    ME = resolveCurrentMember(window.__CURRENT_MEMBER, members, IN_HUB);
    await Promise.all([loadForms(), loadMine()]);
    loadFailed = false;
    // loadForms drops the archive it was merged into: a retry made from the
    // Archived tab reads it again rather than leaving the tab empty.
    if (currentTab === "archived" && canManage()) await loadArchived().catch(e => { console.error(e); toast("Couldn’t load archived forms."); });
    // Only adds the forms behind older copies: a failure here says so and
    // leaves the live list standing.
    await loadSignedForms().catch(e => { console.error(e); toast("Couldn’t load your older signed copies. Try again later."); });
  } catch (e) {
    console.error(e);
    loadFailed = true;
  }
  render();
  handleDeepLink();
}

init();
</script>
