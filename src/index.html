<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forms</title>
  <base href="/run/forms/" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
      --shadow-md:    0 4px 12px rgba(0,0,0,.1);
      --red:          var(--hub-tint-danger-fg, #dc2626);
      --red-light:    var(--hub-tint-danger, #fee2e2);
      --green:        var(--hub-tint-success-fg, #059669);
      --green-light:  var(--hub-tint-success, #d1fae5);
      --amber:        var(--hub-tint-warning-fg, #d97706);
      --amber-light:  var(--hub-tint-warning, #fef3c7);
    }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 760px; margin: 0 auto; padding: 16px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; text-decoration: none;
      transition: opacity .15s, background .15s; font-family: inherit;
    }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border-mid); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--red); color: white; }
    .btn-success { background: var(--green); color: white; }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
    .btn-xs { padding: 3px 8px; font-size: 0.75rem; border-radius: 6px; }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
    .page-header h1 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

    .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--border); flex-wrap: wrap; }
    .tab {
      padding: 8px 14px; font-size: 0.875rem; font-weight: 600; cursor: pointer; border: none; background: transparent;
      color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -2px; font-family: inherit;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 0.7rem; font-weight: 700; background: var(--red); color: white; line-height: 1; }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .list-more { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .form-card { cursor: pointer; transition: box-shadow .15s; }
    .form-card:hover { box-shadow: var(--shadow-md); }
    .card-inner { padding: 14px 16px; }
    .card-title { font-weight: 700; font-size: 1rem; }
    .card-desc { font-size: 0.875rem; color: var(--muted); margin: 4px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
    .meta-dot::before { content: "·"; margin-right: 10px; }

    .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
    .status-draft    { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
    .status-open     { background: var(--green-light); color: var(--green); }
    .status-closed   { background: var(--amber-light); color: var(--amber); }
    .status-archived { background: var(--bg); color: var(--muted); }
    .status-done     { background: var(--green-light); color: var(--green); }
    .status-todo     { background: var(--red-light); color: var(--red); }
    .status-sign     { background: var(--amber-light); color: var(--amber); }

    .notice { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.85rem; }
    .notice.warn { background: var(--amber-light); border: 1.5px solid #fcd34d; color: var(--amber); font-weight: 600; }
    .notice.info { background: var(--card); border: 1px solid var(--border); color: var(--muted); }
    .notice.ok { background: var(--green-light); border: 1.5px solid #6ee7b7; color: var(--green); font-weight: 600; }
    .notice.bad { background: var(--red-light); border: 1.5px solid #fca5a5; color: var(--red); font-weight: 600; }

    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    .empty-icon { margin-bottom: 12px; }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .inline-error { color: var(--red); font-size: 0.85rem; margin-top: 8px; font-weight: 600; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal { background: var(--card); border-radius: calc(var(--radius) * 1.5); box-shadow: var(--shadow-md); width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow-y: auto; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; gap: 8px; }
    .modal-header h2 { font-size: 1.1rem; font-weight: 700; flex: 1; min-width: 0; }
    .modal-close { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.25rem; line-height: 1; padding: 4px; }
    .modal-body { padding: 16px 20px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 20px 18px; flex-wrap: wrap; }

    .form-group { margin-bottom: 14px; }
    .form-group > label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
    .form-group input[type="text"], .form-group input[type="date"], .form-group input[type="number"], .form-group input[type="url"],
    .form-group textarea, .form-group select {
      width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.9rem;
      font-family: inherit; color: var(--text); background: var(--bg); resize: vertical;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
    .form-hint { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    .check-row { display: flex; align-items: flex-start; gap: 8px; font-size: 0.9rem; margin: 6px 0; cursor: pointer; }
    .check-row input { margin-top: 4px; }
    .toggle-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; }
    .toggle-row label { flex: 1; font-size: 0.875rem; font-weight: 600; cursor: pointer; }

    .section { margin-top: 18px; }
    .section h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .section h3 .spacer { flex: 1; }
    .detail-desc { white-space: pre-wrap; word-break: break-word; color: var(--muted); font-size: 0.9rem; margin-bottom: 10px; }
    .actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    .question { padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); margin-bottom: 10px; }
    .q-label { font-weight: 600; font-size: 0.95rem; }
    .q-req { color: var(--red); margin-left: 3px; }
    .q-help { font-size: 0.8rem; color: var(--muted); margin: 2px 0 6px; }
    .q-body { white-space: pre-wrap; word-break: break-word; font-size: 0.9rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin: 6px 0; max-height: 320px; overflow-y: auto; }
    .q-type { font-size: 0.75rem; color: var(--muted); }
    .q-row { display: flex; align-items: center; gap: 8px; }
    .q-row .grow { flex: 1; min-width: 0; }
    .answer { font-size: 0.9rem; white-space: pre-wrap; word-break: break-word; }
    .answer.none { color: var(--muted); font-style: italic; }
    .link-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.8rem; margin: 2px 4px 2px 0; }

    .signature-box { border: 1.5px solid var(--border-mid); border-radius: 8px; padding: 12px 14px; margin-top: 14px; background: var(--bg); }
    .signature-box .statement { white-space: pre-wrap; word-break: break-word; font-size: 0.9rem; margin-bottom: 10px; }
    .signed-line { font-family: "Georgia", serif; font-size: 1.1rem; font-style: italic; }

    table.completion { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    table.completion th, table.completion td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
    table.completion th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }

    .search-row { margin-bottom: 12px; }
    .search-input { width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px; padding: 9px 11px; font: inherit; background: var(--card); color: var(--text); }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(90vw, 420px); padding: 10px 16px; border-radius: 8px; background: var(--text); color: var(--accent-fg); font-size: 0.85rem; box-shadow: 0 4px 14px rgba(0,0,0,.18); z-index: 60; text-align: center; }

    @media print {
      /* Out of the layout, not just hidden: a hidden page keeps its height,
         and the copy would print after that many blank pages. */
      body > *:not(.modal-backdrop) { display: none !important; }
      .modal-backdrop { position: static; background: none; padding: 0; display: block; }
      .modal { box-shadow: none; max-height: none; max-width: none; overflow: visible; }
      .modal-actions, .modal-close { display: none !important; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="page-header">
    <h1><span id="page-glyph"></span> Forms</h1>
    <div style="display:flex;gap:8px;align-items:center" id="header-actions"></div>
  </div>
  <div id="notice" data-testid="notice"></div>
  <div id="tabs" class="tabs" data-testid="tabs"></div>
  <div class="search-row" id="search-row" style="display:none">
    <input id="search" data-testid="search" class="search-input" type="search" placeholder="Search forms…" aria-label="Search forms" />
  </div>
  <div id="main" data-testid="main"></div>
</div>

<script type="module">
import {
  hubAlert, hubConfirm, esc, isAdult, formatRelativeDate, searchMatch, hubToday, glyph, chickadee,
  createFilesHelper, createShareHelper, activeShareLinks, SHARE_EXPIRY_CHOICES, DEFAULT_SHARE_EXPIRY_HOURS,
  sendHubNotification, hubAppUrl, logHubActivity,
} from "/hub-sdk.js";
import { createShareUi, createOverlayView } from "/hub-share-ui.js";
import {
  QUESTION_TYPES, MAX_QUESTIONS, MAX_INTAKE_PER_LINK,
  OPEN_FORM_SQL, CLOSE_FORM_SQL, REOPEN_FORM_SQL, ARCHIVE_FORM_SQL, SUBMIT_SQL, SUBMIT_SIGNED_SQL, FORM_STATE_SQL,
  SAVE_DRAFT_SQL, ANSWER_FILE_SCOPE, attachedFile, answerFileIds,
  parseObject, parseStrings, isFileId,
  canManage as _canManage, canReview as _canReview, reviewersProblem, resolveCurrentMember,
  audienceIds, inAudience, audienceLabel, completion, termsHash, submissionIntact, notifyAudience, safeLink,
  formDraft, questionDraft, cleanAnswers, cleanSignature, answerText,
  todoForms, byDueThenNewest, formById, mySubmission, isOverdue, searchableFields, formatDay, formatWhen, submittedWhileClosed, endClosedSpell,
  outcomeUnknown, failureLine, uploadFailureLine,
} from "./logic.js";

document.getElementById("page-glyph").innerHTML = glyph("checklist");

const CONTEXT          = window.__CONTEXT_URL      ?? "";
const DB               = window.__DB_URL           ?? "";
const APP_ID           = window.__APP_ID           ?? "forms";
const ADMIN_CONFIG_URL = window.__ADMIN_CONFIG_URL ?? "";
const FILES_URL        = window.__FILES_URL        ?? "";
const IN_HUB           = !!DB;
const TENANT = { tenantKind: window.__TENANT_KIND ?? "household", spaceKind: window.__SPACE_KIND ?? null, isAdmin: window.__IS_ADMIN === true };
const hubAdmin = window.__CURRENT_MEMBER?.isAdmin === true || TENANT.isAdmin;

let ME = null;
let members = [];
let appMembers = null;
let groups = [];
let reviewersGroupId = null;
let forms = [];
let mine = [];                 // this member's submissions
const questionsByForm = new Map();
const submissionsByForm = new Map();   // reviewers only
const intakeByForm = new Map();
let currentTab = "todo";
let searchQ = "";
let view = { kind: "list" };   // or { kind: "form", id }
let modalEl = null;
let loadFailed = false;
// `uploading`: the questions whose file is on its way up. Nothing is saved or
// submitted until each has landed in the draft.
const fillState = { formId: null, answers: {}, signature: { name: null, agreed: false }, error: "", uploading: new Set() };
// Forms whose questions could not be read on the last try. Until a read
// succeeds the page offers no way to answer, sign or submit: an unread form
// is not a form with no questions.
const questionsFailed = new Set();

function canManage() { return _canManage(isAdult(ME), TENANT); }
function canReview() { return _canReview(ME, groups, reviewersGroupId, TENANT); }
// A roster participant sees only the steward and themselves; nobody else
// sees a partial roster.
const COMPLETE_ROSTER = TENANT.spaceKind !== "roster" || TENANT.isAdmin;
const ctx = () => ({ groups, appMembers, members, complete: COMPLETE_ROSTER });
function memberName(id) { return members.find(m => m.id === id)?.name ?? "Someone"; }

// A read step's document: uploaded by the builder, opened by every member who
// can read the question (the hub's default file rule).
const files = createFilesHelper(FILES_URL);
const DOC_TYPES = ["application/pdf", "image/jpeg", "image/png", "image/webp", "image/heic", "image/heif", "text/plain",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document"];
const docLink = (q) => isFileId(q.file_id)
  ? `<p><a class="link-chip" data-testid="read-document" href="${esc(files.url(q.file_id))}" target="_blank" rel="noopener">${glyph("document")} ${esc(q.file_name || "Open the document")}</a></p>`
  : "";

// ── Share links (intake) ─────────────────────────────────────────────────────

const share = createShareHelper(window.__SHARE_CREATE_URL, window.__SHARE_REVOKE_URL, window.__SHARE_LIST_URL);
const shareView = createOverlayView(document);
const shareUi = createShareUi({
  share, itemType: "form", noun: "form",
  writable: true, writableVerb: "send their details",
  scopeHtml: () => `The page shows the form’s title and description, and a short intake form: a name, an email, a phone number and a note. Nothing a member answered is on it. Each link takes up to ${MAX_INTAKE_PER_LINK} submissions.`,
  esc, glyph,
  confirm: (message, opts) => hubConfirm({ message, ...opts, destructive: true }),
  writeText: (text) => navigator.clipboard.writeText(text),
  activeLinks: activeShareLinks, expiryChoices: SHARE_EXPIRY_CHOICES, defaultExpiryHours: DEFAULT_SHARE_EXPIRY_HOURS,
  getMe: () => ME, isAdmin: () => hubAdmin,
  memberName: (id) => members.find(m => m.id === id)?.name ?? "",
  view: shareView,
});
shareView.bind(shareUi);

// ── DB helpers ───────────────────────────────────────────────────────────────

async function db(sql, params = []) {
  if (!DB) return { rows: [], changed: 0 };
  const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql, params }) });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw Object.assign(new Error(json?.error || `Database request failed (${res.status})`), { status: res.status, code: json?.code });
  return json;
}

async function dbBatch(statements) {
  if (!DB || statements.length === 0) return { results: [] };
  const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ statements }) });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw Object.assign(new Error(json?.error || `Database request failed (${res.status})`), { status: res.status, code: json?.code });
  return json;
}

function userError(msg) { return Object.assign(new Error(msg), { forUser: true }); }

// ── Loading ──────────────────────────────────────────────────────────────────

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "admin", isAdmin: true },
      { id: "demo-2", name: "Jamie", role: "adult" },
      { id: "demo-3", name: "Casey", role: "child" },
    ];
    groups = [{ id: "g-board", name: "Board", memberIds: ["demo-1", "demo-2"] }];
    appMembers = null;
    return;
  }
  const res = await fetch(`${CONTEXT}?keys=family.members,family.groups,family.app_members`);
  const data = await res.json().catch(() => null);
  if (!res.ok || !data || typeof data !== "object" || data.error) throw new Error("Couldn’t reach the hub. Try again.");
  if (Array.isArray(data.$errors) && ["family.members", "family.groups", "family.app_members"].some(k => data.$errors.includes(k))) throw new Error("Couldn’t reach the hub. Try again.");
  members = data["family.members"] ?? [];
  groups = data["family.groups"] ?? [];
  appMembers = data["family.app_members"] ?? null;
}

async function loadSettings() {
  if (!DB) return;
  const { rows } = await db(`SELECT value FROM app_forms__settings WHERE key = 'reviewers_group_id'`);
  reviewersGroupId = rows?.[0]?.value || null;
}

// ── Paged reads ──────────────────────────────────────────────────────────────

// The page size. Statements read in full spell it as the literal `LIMIT 200`,
// because manifest.preload must match the first one's text exactly, so
// readAllById refuses a statement that says otherwise.
const PAGE = 200;

/** Every row `first` matches, in pages on the primary key, the one column
 *  always comparable. `first` has a WHERE and ends `ORDER BY id ASC LIMIT
 *  200`; each later page adds `AND id > ?` with the last id seen. */
async function readAllById(first, params = []) {
  const tail = ` ORDER BY id ASC LIMIT ${PAGE}`;
  if (!first.endsWith(tail) || !first.includes(" WHERE ")) throw new Error(`A paged read needs a WHERE and must end${tail}`);
  const next = `${first.slice(0, -tail.length)} AND id > ?${tail}`;
  let { rows } = await db(first, params);
  const all = [...(rows ?? [])];
  while (rows?.length === PAGE) {
    ({ rows } = await db(next, [...params, rows[rows.length - 1].id]));
    all.push(...(rows ?? []));
  }
  return all;
}

/** One page of `table`, newest first, after `cursor` (the last row of the
 *  page before, or null for the first). Keyset on (created_at, id), both
 *  plaintext. Returns the rows and the cursor for the next page, null once
 *  there is none. */
async function readNewestPage(table, where, params, cursor) {
  const after = cursor ? " AND (created_at < ? OR (created_at = ? AND id < ?))" : "";
  const { rows } = await db(
    `SELECT * FROM ${table} WHERE ${where}${after} ORDER BY created_at DESC, id DESC LIMIT ${PAGE}`,
    cursor ? [...params, cursor.created_at, cursor.created_at, cursor.id] : params,
  );
  const list = rows ?? [];
  const last = list[list.length - 1];
  return { rows: list, cursor: list.length === PAGE && last ? { created_at: last.created_at, id: last.id } : null };
}

// "Show older" loads in flight, by key: a redraw draws a fresh, enabled
// button, and a second press would append the same page twice.
const loadingMore = new Set();
function loadMore(key, load, failure) {
  if (loadingMore.has(key)) return;
  loadingMore.add(key);
  render();
  load().catch(err => { console.error(err); toast(failure); }).finally(() => { loadingMore.delete(key); render(); });
}

async function loadForms() {
  if (!DB) return;
  // Every live form: To do and the agenda must see an old open form however
  // many newer ones sit above it. The page sorts for display. The first
  // statement is the one manifest.preload answers.
  forms = await readAllById(`SELECT * FROM app_forms__forms WHERE status != 'archived' ORDER BY id ASC LIMIT 200`);
  // The archive loaded before is gone with the list it was merged into.
  archivedLoaded = false;
  archiveCursor = null;
}

// A builder's Archived tab pages through every archived form, newest first,
// 200 at a time ("Show older"); a member's holds only the archived forms they
// signed (loadSignedForms).
let archivedLoaded = false;
let archiveCursor = null;  // the last row loaded, or null when the archive is complete
async function loadArchived({ more = false } = {}) {
  if (!DB) return;
  const page = await readNewestPage("app_forms__forms", "status = 'archived'", [], more ? archiveCursor : null);
  mergeForms(page.rows);
  archiveCursor = page.cursor;
  archivedLoaded = true;
}

function mergeForms(rows) {
  const byId = new Map(forms.map(f => [f.id, f]));
  for (const row of rows) byId.set(row.id, row);
  forms = [...byId.values()];
}

// Every submission of mine, in pages: a member's row per form is what decides
// To do, Submitted and which draft a save writes, so a capped read would show
// an old form as unanswered and the next save would collide with the row it
// did not load. Paged on the primary key, the one column always comparable.
// The first statement is the one manifest.preload answers at boot.
async function loadMine() {
  if (!DB || !ME?.id) return;
  mine = await readAllById(`SELECT * FROM app_forms__submissions WHERE member_id = ? ORDER BY id ASC LIMIT 200`, [ME.id]);
}

/** This member's row for one form, read directly and merged in. */
async function loadMineFor(formId) {
  if (!DB || !ME?.id) return null;
  const { rows } = await db(`SELECT * FROM app_forms__submissions WHERE form_id = ? AND member_id = ?`, [formId, ME.id]);
  const row = rows?.[0] ?? null;
  mine = [...mine.filter(s => s.form_id !== formId), ...(row ? [row] : [])];
  return row;
}

// 2. The forms behind my signed copies that the live list did not load (an
// archived form, or one older than its cap), so a member can always reopen
// and print what they signed. Read by id, in chunks under the bound-parameter limit.
async function loadSignedForms() {
  if (!DB) return;
  const have = new Set(forms.map(f => f.id));
  const missing = [...new Set(mine.filter(s => s.status === "submitted" && !have.has(s.form_id)).map(s => s.form_id))];
  for (let i = 0; i < missing.length; i += 90) {
    const ids = missing.slice(i, i + 90);
    const { rows } = await db(`SELECT * FROM app_forms__forms WHERE id IN (${ids.map(() => "?").join(", ")})`, ids);
    mergeForms(rows ?? []);
  }
}

async function loadQuestions(formId) {
  if (!DB) return questionsByForm.get(formId) ?? [];
  const { rows } = await db(`SELECT * FROM app_forms__questions WHERE form_id = ? ORDER BY position ASC, id ASC`, [formId]);
  questionsByForm.set(formId, rows ?? []);
  return rows ?? [];
}

// Every submission to one form, in pages: the completion counts and the
// reminders read the whole list, so a capped read would show a member who
// signed as outstanding. Sorted here for display, newest copy first.
async function loadSubmissions(formId) {
  if (!DB) return submissionsByForm.get(formId) ?? [];
  const all = await readAllById(`SELECT * FROM app_forms__submissions WHERE form_id = ? ORDER BY id ASC LIMIT 200`, [formId]);
  const at = (s) => String(s.submitted_at ?? "");
  all.sort((x, y) => (!x.submitted_at - !y.submitted_at) || at(y).localeCompare(at(x)) || String(y.updated_at ?? "").localeCompare(String(x.updated_at ?? "")));
  submissionsByForm.set(formId, all);
  return all;
}

// A form's outside submissions, newest first, a page at a time ("Show
// older"): the table holds up to 5,000. intakeCursor holds the last row
// loaded per form, or null once that form's list is complete.
const intakeCursor = new Map();
async function loadIntake(formId, { more = false } = {}) {
  if (!DB) return intakeByForm.get(formId) ?? [];
  const page = (cursor) => readNewestPage("app_forms__intake", "form_id = ?", [formId], cursor);
  let list;
  let cursor;
  if (more) {
    if (!intakeCursor.get(formId)) return intakeByForm.get(formId) ?? [];
    const next = await page(intakeCursor.get(formId));
    // Merged by id: a refresh may have landed while this page was loading.
    const seen = new Set((intakeByForm.get(formId) ?? []).map(r => r.id));
    list = [...(intakeByForm.get(formId) ?? []), ...next.rows.filter(r => !seen.has(r.id))];
    cursor = next.cursor;
  } else {
    // A refresh reads the newest page only and keeps the older pages the
    // builder had already opened. Within the fresh page the hub's rows are
    // the truth (a row missing there was removed); older rows stay until
    // the next load, as does the cursor past them.
    const fresh = await page(null);
    const had = intakeByForm.get(formId) ?? [];
    const last = fresh.rows[fresh.rows.length - 1];
    const older = (r) => !!fresh.cursor && !!last
      && (String(r.created_at) < String(last.created_at) || (r.created_at === last.created_at && String(r.id) < String(last.id)));
    // The older rows join on only if the fresh page reaches them: when more
    // than a page arrived since the last load, the rows between the two were
    // never read, and keeping the old cursor would skip them for good.
    const reaches = had.length > 0 && !older(had[0]);
    const kept = reaches ? had.filter(older) : [];
    list = [...fresh.rows, ...kept];
    cursor = kept.length ? intakeCursor.get(formId) ?? null : fresh.cursor;
  }
  intakeCursor.set(formId, cursor);
  intakeByForm.set(formId, list);
  return list;
}

// ── Render: shell ────────────────────────────────────────────────────────────

document.addEventListener("change", (e) => {
  const questionId = e.target?.dataset?.fileQ;
  if (questionId && view.kind === "form") attachAnswerFile(view.id, questionId, e.target);
});

document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  renderMain();
});

function render() {
  // The header controls exist only for whoever may use them: a hidden button
  // is still a button in the DOM, and a page that only hides what the hub
  // would refuse reads as offering it.
  const actions = document.getElementById("header-actions");
  if (actions) {
    actions.innerHTML = [
      hubAdmin && IN_HUB ? `<button class="btn btn-ghost" data-testid="settings" aria-label="Reviewer settings" data-action="settings">${glyph("gear")}</button>` : "",
      canManage() && !loadFailed ? `<button class="btn btn-primary" data-testid="new-form" data-action="new">New form</button>` : "",
    ].join("");
  }
  renderNotice();
  renderTabs();
  renderMain();
}

function renderNotice() {
  const el = document.getElementById("notice");
  if (!el) return;
  if (!IN_HUB || !canManage()) { el.innerHTML = ""; return; }
  const problem = reviewersProblem(groups, reviewersGroupId, { spaceKind: TENANT.spaceKind, memberId: ME?.id });
  if (!problem) { el.innerHTML = ""; return; }
  const cause = {
    unset: "No reviewers group is set",
    missing: "The reviewers group has been deleted",
    empty: "The reviewers group has no members",
    no_steward: "You are not in the reviewers group, and here only the steward in that group can read submissions",
  }[problem];
  el.innerHTML = hubAdmin
    ? `<div class="notice warn"><span>${cause}, so nobody can read what members submit. Submissions are kept either way.</span><button class="btn btn-primary btn-sm" data-action="settings">${problem === "unset" ? "Set reviewers" : "Change reviewers"}</button></div>`
    : `<div class="notice info"><span>${cause}. Ask a hub admin to set one so submissions can be reviewed.</span></div>`;
}

function renderTabs() {
  const el = document.getElementById("tabs");
  if (!el) return;
  if (view.kind !== "list") { el.innerHTML = ""; el.style.display = "none"; return; }
  el.style.display = "";
  const todo = ME?.id ? todoForms(forms, mine, ME.id, ctx()).length : 0;
  const tabs = [
    ["todo", `To do ${todo ? `<span class="badge" data-testid="todo-badge">${todo}</span>` : ""}`],
    ["all", "All forms"],
  ];
  if (canManage()) tabs.push(["drafts", "Drafts"], ["archived", "Archived"]);
  else if (forms.some(f => f.status === "archived")) tabs.push(["archived", "Archived"]);
  if (!tabs.some(([k]) => k === currentTab)) currentTab = "todo";
  el.innerHTML = tabs.map(([key, label]) => `<button class="tab ${currentTab === key ? "active" : ""}" data-tab="${key}" data-testid="tab-${key}" data-action="tab" data-id="${key}">${label}</button>`).join("");
}

function scopedList() {
  if (currentTab === "todo") return ME?.id ? todoForms(forms, mine, ME.id, ctx()) : [];
  if (currentTab === "all") return forms.filter(f => f.status === "open" || f.status === "closed").sort(byDueThenNewest);
  if (currentTab === "drafts") return forms.filter(f => f.status === "draft").sort(byDueThenNewest);
  if (currentTab === "archived") return forms.filter(f => f.status === "archived").sort(byDueThenNewest);
  return [];
}

function renderMain() {
  const main = document.getElementById("main");
  if (!main) return;
  if (loadFailed) {
    document.getElementById("search-row").style.display = "none";
    main.innerHTML = `<div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the forms.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
    return;
  }
  if (view.kind === "form") {
    document.getElementById("search-row").style.display = "none";
    renderFormPage(main);
    return;
  }
  const scoped = scopedList();
  document.getElementById("search-row").style.display = scoped.length ? "" : "none";
  const items = searchQ ? scoped.filter(f => searchMatch(searchQ, searchableFields(f))) : scoped;
  // Titles are encrypted, so the hub cannot search the archive: a search here
  // covers the archived forms loaded so far, and says so while older ones remain.
  const archiveIncomplete = currentTab === "archived" && canManage() && !!archiveCursor;
  const older = archiveIncomplete
    ? `<div class="list-more">${searchQ ? `<p class="form-hint" data-testid="archive-partial">Searching the archived forms loaded so far. Older ones are not searched yet.</p>` : ""}<button class="btn btn-ghost" data-testid="archive-more" data-action="archive-more" ${loadingMore.has("archive") ? "disabled" : ""}>Show older archived forms</button></div>`
    : "";
  if (items.length === 0) {
    if (searchQ) {
      const lead = archiveIncomplete ? `No match among the archived forms loaded so far for "${esc(searchQ)}".` : `Nothing matches "${esc(searchQ)}".`;
      main.innerHTML = `<div class="empty" data-testid="empty-state"><div class="empty-icon">${chickadee("searching")}</div><p>${lead}</p></div>${older}`;
      return;
    }
    const msgs = {
      todo: { pose: "sleeping", text: "Nothing to fill in right now." },
      all: { pose: "nest", text: "No forms yet." },
      drafts: { pose: "nest", text: "No drafts. Start one with New form." },
      archived: { pose: "nest", text: "Nothing archived." },
    };
    const { pose, text } = msgs[currentTab] ?? msgs.all;
    main.innerHTML = `<div class="empty" data-testid="empty-state"><div class="empty-icon">${chickadee(pose)}</div><p>${text}</p></div>`;
    return;
  }
  main.innerHTML = `<div class="list">${items.map(renderCard).join("")}</div>${older}`;
}

function statusBadge(status) {
  const labels = { draft: "Draft", open: "Open", closed: "Closed", archived: "Archived" };
  return `<span class="status-badge status-${esc(status)}" data-testid="status-badge" data-status="${esc(status)}">${labels[status] ?? esc(status)}</span>`;
}

function myBadge(form) {
  if (!ME?.id || form.status !== "open") return "";
  const sub = mySubmission(mine, form.id, ME.id);
  if (sub?.status === "submitted") return `<span class="status-badge status-done" data-testid="my-state" data-state="submitted">${glyph("tick")} Submitted</span>`;
  if (!inAudience(form, ME.id, ctx())) return "";
  if (sub) return `<span class="status-badge status-todo" data-testid="my-state" data-state="draft">Draft saved</span>`;
  return `<span class="status-badge status-todo" data-testid="my-state" data-state="none">To do</span>`;
}

function dueMeta(form) {
  return form.due_date ? `<span class="meta-dot">${isOverdue(form, hubToday()) ? "Was due" : "Due"} ${formatDay(form.due_date)}</span>` : "";
}

function signatureBadge(form) {
  return Number(form.requires_signature) ? `<span class="status-badge status-sign">${glyph("signature")} Signature</span>` : "";
}

function renderCard(form) {
  const due = dueMeta(form);
  const signs = signatureBadge(form);
  return `
    <div class="card form-card" data-testid="form-card" data-form-id="${esc(form.id)}" data-status="${esc(form.status)}" data-action="open" data-id="${esc(form.id)}">
      <div class="card-inner">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
          <div class="card-title" data-testid="form-title">${esc(form.title)}</div>
          <div style="display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">${signs}${myBadge(form)}${statusBadge(form.status)}</div>
        </div>
        ${form.description ? `<div class="card-desc">${esc(form.description)}</div>` : ""}
        <div class="meta"><span>${esc(audienceLabel(form, ctx()))}</span>${due}<span class="meta-dot">${formatRelativeDate(form.created_at)}</span></div>
      </div>
    </div>`;
}

// ── Render: one form ─────────────────────────────────────────────────────────

async function openForm(id) {
  const form = formById(forms, id);
  if (!form) return;
  view = { kind: "form", id };
  if (fillState.formId !== id) {
    // A save still on its way (a file attached just before leaving a form)
    // is what that draft holds: wait for it before switching, so this form
    // is never shown, or saved, with answers from before it. Until then the
    // fill state is still the last form's, which every action checks.
    await draftWrites;
    if (view.kind !== "form" || view.id !== id) return;
    if (fillState.formId !== id) {
      Object.assign(fillState, { formId: id, answers: {}, signature: { name: null, agreed: false }, error: "", uploading: new Set() });
      const sub = mySubmission(mine, id, ME?.id);
      if (sub && sub.status === "draft") {
        fillState.answers = parseObject(sub.answers);
        draftBases.set(id, revisionOf(sub));
      } else {
        draftBases.delete(id);
      }
    }
  }
  render();
  // Each read redraws the page when it lands, whatever the others do: one
  // that fails first must not leave the page waiting on the rest.
  const redraw = () => { if (view.kind === "form" && view.id === id) render(); };
  const loads = [loadQuestions(id).then(
    (rows) => { questionsFailed.delete(id); return rows; },
    (e) => { questionsFailed.add(id); throw e; },
  )];
  if (canReview()) loads.push(loadSubmissions(id));
  // A draft has no intake link yet, so nothing can have come through one.
  if (canManage() && form.status !== "draft") loads.push(loadIntake(id));
  const results = await Promise.allSettled(loads.map(p => p.finally(redraw)));
  const failed = results.filter(r => r.status === "rejected");
  if (failed.length) { failed.forEach(r => console.error(r.reason)); if (view.kind === "form" && view.id === id) toast("Couldn’t load part of this form. Try again."); }
}

function closeForm() {
  view = { kind: "list" };
  render();
}

function renderFormPage(main) {
  const form = formById(forms, view.id);
  if (!form) { closeForm(); return; }
  // Whatever redraws the page (a read landing, an upload finishing), what the
  // member has typed so far is taken from the inputs first, so it survives.
  if (fillState.formId === form.id) collectAnswers(form.id);
  const questions = questionsByForm.get(form.id) ?? [];
  const questionsReady = questionsByForm.has(form.id);
  const manage = canManage();
  const review = canReview();
  const sub = ME?.id ? mySubmission(mine, form.id, ME.id) : null;
  const forMe = ME?.id ? inAudience(form, ME.id, ctx()) : false;
  const due = dueMeta(form);

  let fill = "";
  // A submitted copy is the member's answer whatever the form's state since.
  if (sub?.status === "submitted") {
    fill = `<div class="notice ok" data-testid="submitted-notice"><span>${glyph("tick")} You submitted this ${formatRelativeDate(sub.submitted_at)}.</span><button class="btn btn-ghost btn-sm" data-testid="view-mine" data-action="view-mine" data-id="${esc(form.id)}">View your copy</button></div>`;
  } else if (form.status === "open" && forMe && questionsFailed.has(form.id)) {
    fill = `<div class="load-error" data-testid="questions-error" role="alert"><span>Couldn’t load this form’s questions.</span> <button type="button" class="load-error-retry" data-action="retry-questions" data-id="${esc(form.id)}">Try again</button></div>`;
  } else if (form.status === "open" && forMe && (!questionsReady || fillState.formId !== form.id)) {
    // Also while the fill state is still the last form's (openForm waits for
    // that form's saves first): drawn now, these inputs would hold the wrong
    // answers, and the next redraw would read them in as this form's.
    fill = `<div class="notice info" data-testid="questions-loading"><span>Loading the questions…</span></div>`;
  } else if (form.status === "open" && forMe && questions.length === 0) {
    fill = `<div class="notice info" data-testid="no-questions"><span>This form has no questions, so there is nothing to fill in. Ask whoever made it.</span></div>`;
  } else if (form.status === "open" && forMe) {
    fill = renderFill(form, questions, sub);
  } else if (form.status === "open") {
    fill = `<div class="notice info" data-testid="not-for-you"><span>This form is for ${esc(audienceLabel(form, ctx()))}.</span></div>`;
  } else if (form.status === "closed") {
    fill = `<div class="notice info"><span>This form is closed and no longer takes submissions.</span></div>`;
  } else if (form.status === "archived") {
    fill = `<div class="notice info"><span>This form is archived and no longer takes submissions.</span></div>`;
  } else if (form.status === "draft" && !manage) {
    fill = `<div class="notice info"><span>This form is still being written.</span></div>`;
  }

  main.innerHTML = `
    <div data-testid="form-page" data-form-id="${esc(form.id)}">
      <div class="actions-row" style="margin:0 0 10px"><button class="btn btn-ghost btn-sm" data-testid="back" data-action="back">← All forms</button></div>
      <div class="card"><div class="card-inner">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
          <h2 style="font-size:1.15rem;font-weight:700" data-testid="detail-title">${esc(form.title)}</h2>
          <div style="display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">${signatureBadge(form)}${statusBadge(form.status)}</div>
        </div>
        ${form.description ? `<p class="detail-desc" style="margin-top:6px">${esc(form.description)}</p>` : ""}
        <div class="meta"><span>${esc(audienceLabel(form, ctx()))}</span>${due}<span class="meta-dot">Created by ${esc(memberName(form.created_by))}</span></div>
      </div></div>
      <div class="section">${fill}</div>
      ${manage ? renderManage(form, questions) : ""}
      ${review ? renderReview(form) : ""}
      ${manage ? renderIntake(form) : ""}
    </div>`;
}

function renderQuestionInput(q, value) {
  // Escaped: a question id is a column any adult can write by raw SQL, and it
  // lands inside attributes below.
  const id = `ans-${esc(q.id)}`;
  const name = `data-q="${esc(q.id)}"`;
  switch (q.type) {
    case "text": return `<input type="text" id="${id}" ${name} maxlength="4000" value="${esc(value ?? "")}" />`;
    case "multiline": return `<textarea id="${id}" ${name} rows="3" maxlength="4000">${esc(value ?? "")}</textarea>`;
    case "number": return `<input type="number" id="${id}" ${name} value="${esc(value ?? "")}" />`;
    case "date": return `<input type="date" id="${id}" ${name} value="${esc(value ?? "")}" />`;
    case "choice": return parseStrings(q.options).map((o, i) => `<label class="check-row"><input type="radio" name="${id}" ${name} value="${esc(o)}" ${value === o ? "checked" : ""} /> <span>${esc(o)}</span></label>`).join("");
    case "multi": return parseStrings(q.options).map(o => `<label class="check-row"><input type="checkbox" ${name} data-multi="1" value="${esc(o)}" ${Array.isArray(value) && value.includes(o) ? "checked" : ""} /> <span>${esc(o)}</span></label>`).join("");
    case "yesno": return ["yes", "no"].map(o => `<label class="check-row"><input type="radio" name="${id}" ${name} value="${o}" ${value === o ? "checked" : ""} /> <span>${o === "yes" ? "Yes" : "No"}</span></label>`).join("");
    case "read": {
      const link = safeLink(q.link_url) ? `<p><a class="link-chip" href="${esc(safeLink(q.link_url))}" target="_blank" rel="noopener">${glyph("link")} ${esc(q.link_url)}</a></p>` : "";
      return `${docLink(q)}${q.body ? `<div class="q-body">${esc(q.body)}</div>` : ""}${link}<label class="check-row"><input type="checkbox" ${name} data-read="1" ${value ? "checked" : ""} /> <span>I have read this</span></label>`;
    }
    case "file": {
      // Held in fillState, never read back from an input: the answer is the
      // file the hub stored, which the draft row already names.
      const file = attachedFile(value);
      const chip = file
        ? `<p><span class="link-chip" data-testid="answer-file">${glyph("document")} <a href="${esc(files.url(file.file_id))}" target="_blank" rel="noopener">${esc(file.name || "Attached file")}</a> <button type="button" class="btn btn-xs btn-ghost" data-action="remove-answer-file" data-question="${esc(q.id)}" aria-label="Remove the file">×</button></span></p>`
        : "";
      const picker = fillState.uploading.has(q.id)
        ? `<p class="form-hint">Uploading…</p>`
        : file ? "" : FILES_URL
          ? `<input type="file" id="${id}" data-testid="answer-file-input" data-file-q="${esc(q.id)}" accept="${DOC_TYPES.join(",")}" />`
          : `<p class="form-hint">Attaching files works inside the hub.</p>`;
      return `${chip}${picker}<p class="form-hint">Only you and this form’s reviewers can open the file, from the moment you attach it.</p>`;
    }
    default: return "";
  }
}

function renderFill(form, questions, sub) {
  const answers = fillState.answers;
  const signs = Number(form.requires_signature) === 1;
  return `
    <form id="fill-form" data-testid="fill-form" data-form-id="${esc(form.id)}" onsubmit="return false">
      ${questions.map(q => `
        <div class="question" data-testid="question" data-question-id="${esc(q.id)}">
          <div class="q-label">${esc(q.label)}${Number(q.required) ? `<span class="q-req" title="Required">*</span>` : ""}</div>
          ${q.help ? `<div class="q-help">${esc(q.help)}</div>` : ""}
          <div class="form-group" style="margin:6px 0 0">${renderQuestionInput(q, answers[q.id])}</div>
        </div>`).join("")}
      ${signs ? `
        <div class="signature-box" data-testid="signature-box">
          <div class="q-label">${glyph("signature")} Signature</div>
          <div class="statement">${esc(form.signature_text)}</div>
          <div class="form-group"><label for="sig-name">Type your full name</label><input type="text" id="sig-name" data-testid="sig-name" maxlength="200" autocomplete="name" value="${esc(fillState.signature.name ?? "")}" /></div>
          <label class="check-row"><input type="checkbox" id="sig-agree" data-testid="sig-agree" ${fillState.signature.agreed ? "checked" : ""} /> <span>I agree to the statement above. My name, the time, and the exact wording are kept with my answers.</span></label>
        </div>` : ""}
      <div id="fill-error" class="inline-error" data-testid="fill-error">${esc(fillState.error)}</div>
      <div class="actions-row">
        <button class="btn btn-ghost" data-testid="save-draft" data-action="save-draft" data-id="${esc(form.id)}">Save draft</button>
        <button class="btn btn-primary" data-testid="submit" data-action="submit" data-id="${esc(form.id)}">${signs ? "Sign and submit" : "Submit"}</button>
        ${sub ? `<span class="form-hint" style="align-self:center">Draft saved ${formatRelativeDate(sub.updated_at)}</span>` : ""}
      </div>
    </form>`;
}

/** The audience as words inside a sentence: "everyone", or the label as is,
 *  so a member's or a group's name keeps its own capitals. */
function audiencePhrase(form) {
  return (form?.audience_kind ?? "everyone") === "everyone" ? "everyone" : audienceLabel(form, ctx());
}

function renderManage(form, questions) {
  const draft = form.status === "draft";
  // An unread question list is not an empty one: adding to it would pick the
  // wrong position and skip the question cap, so the builder waits for it.
  const listReady = questionsByForm.has(form.id) && !questionsFailed.has(form.id);
  const actions = [];
  if (draft) actions.push(`<button class="btn btn-primary btn-sm" data-testid="open-form" data-action="open-form" data-id="${esc(form.id)}">Open to ${esc(audiencePhrase(form))}</button>`);
  if (form.status === "open") actions.push(`<button class="btn btn-ghost btn-sm" data-testid="close-form" data-action="close-form" data-id="${esc(form.id)}">Close</button>`);
  if (form.status === "closed") actions.push(`<button class="btn btn-ghost btn-sm" data-testid="reopen-form" data-action="reopen-form" data-id="${esc(form.id)}">Reopen</button>`);
  if (form.status === "open" || form.status === "closed") actions.push(`<button class="btn btn-ghost btn-sm" data-testid="archive-form" data-action="archive-form" data-id="${esc(form.id)}">Archive</button>`);
  if (form.status === "open" && share.enabled && isAdult(ME)) actions.push(`<button class="btn btn-ghost btn-sm" data-testid="share-form" data-action="share" data-id="${esc(form.id)}">${glyph("link")} Intake link</button>`);
  actions.push(`<button class="btn btn-ghost btn-sm" data-testid="edit-form" data-action="edit-form" data-id="${esc(form.id)}">${glyph("pencil")} Settings</button>`);
  if (draft) actions.push(`<button class="btn btn-danger btn-sm" data-testid="delete-form" data-action="delete-form" data-id="${esc(form.id)}">Delete draft</button>`);

  const qList = questions.map((q, i) => `
    <div class="question" data-testid="builder-question" data-question-id="${esc(q.id)}">
      <div class="q-row">
        <div class="grow">
          <div class="q-label">${i + 1}. ${esc(q.label)}${Number(q.required) ? `<span class="q-req">*</span>` : ""}</div>
          <div class="q-type">${esc(QUESTION_TYPES[q.type] ?? q.type)}${q.help ? ` · ${esc(q.help)}` : ""}${q.type === "read" && isFileId(q.file_id) ? ` · ${glyph("document")} ${esc(q.file_name || "Document")}` : ""}</div>
        </div>
        ${draft ? `
          <button class="btn btn-ghost btn-xs" data-action="move-q" data-id="${esc(q.id)}" data-dir="-1" aria-label="Move up" ${i === 0 ? "disabled" : ""}>↑</button>
          <button class="btn btn-ghost btn-xs" data-action="move-q" data-id="${esc(q.id)}" data-dir="1" aria-label="Move down" ${i === questions.length - 1 ? "disabled" : ""}>↓</button>
          <button class="btn btn-ghost btn-xs" data-testid="edit-question" data-action="edit-q" data-id="${esc(q.id)}">Edit</button>
          <button class="btn btn-ghost btn-xs" data-testid="delete-question" data-action="delete-q" data-id="${esc(q.id)}">Remove</button>` : ""}
      </div>
    </div>`).join("");

  return `
    <div class="section" data-testid="manage">
      <h3>${glyph("gear")} Manage <span class="spacer"></span></h3>
      <div class="actions-row" style="margin-top:0">${actions.join("")}</div>
      ${draft ? `<p class="form-hint" style="margin-top:8px">Questions can be changed until the form is opened. Opening fixes the wording every signature is given against.</p>` : `<p class="form-hint" style="margin-top:8px">Questions are fixed: this form has been opened. To change them, archive it and start a new form.</p>`}
      <div style="margin-top:12px" data-testid="builder">${
        questionsFailed.has(form.id)
          ? `<div class="load-error" role="alert"><span>Couldn’t load the questions.</span> <button type="button" class="load-error-retry" data-action="retry-questions" data-id="${esc(form.id)}">Try again</button></div>`
          : !listReady ? `<p class="form-hint">Loading the questions…</p>`
          : (qList || `<p class="form-hint">No questions yet.</p>`)
      }</div>
      ${draft && listReady && questions.length < MAX_QUESTIONS ? `<div class="actions-row"><button class="btn btn-ghost btn-sm" data-testid="add-question" data-action="add-q" data-id="${esc(form.id)}">${glyph("plus")} Add a question or document</button></div>` : ""}
    </div>`;
}

function renderReview(form) {
  const subs = submissionsByForm.get(form.id);
  if (!subs) return `<div class="section" data-testid="review"><h3>${glyph("people")} Submissions</h3><p class="form-hint">Loading…</p></div>`;
  const { rows, extra, done, total, outstanding } = completion(form, subs, ctx());
  const questions = questionsByForm.get(form.id);
  const line = (r) => {
    const s = r.submission;
    const state = r.state === "submitted" ? `<span class="status-badge status-done">Submitted</span>` : `<span class="status-badge status-todo">Not submitted</span>`;
    const when = s?.submitted_at ? formatWhen(s.submitted_at) : "";
    const terms = s?.status === "submitted" && questions && !submissionIntact(questions, s) ? ` <span class="status-badge status-sign" title="The questions changed after this was signed, or the copy was altered">Terms differ</span>` : "";
    // The page refuses a submit to a closed form; a copy that still arrived
    // after the close (by hand-written SQL, or a race with the close) says so.
    const late = submittedWhileClosed(form, s)
      ? ` <span class="status-badge status-todo" data-testid="late-copy" title="Submitted after the form was closed">After close</span>` : "";
    return `<tr data-testid="completion-row" data-member-id="${esc(r.member_id)}" data-state="${esc(r.state)}"><td>${esc(memberName(r.member_id))}</td><td>${state}${terms}${late}</td><td>${esc(when)}</td><td>${s?.status === "submitted" ? `<button class="btn btn-ghost btn-xs" data-testid="view-submission" data-action="view-sub" data-id="${esc(s.id)}">View</button>` : ""}</td></tr>`;
  };
  return `
    <div class="section" data-testid="review">
      <h3>${glyph("people")} Submissions <span class="form-hint" data-testid="completion-count">${done} of ${total}</span><span class="spacer"></span>
        ${form.status === "open" && outstanding.length && isAdult(ME) ? `<button class="btn btn-ghost btn-xs" data-testid="remind" data-action="remind" data-id="${esc(form.id)}">Remind ${outstanding.length}</button>` : ""}
      </h3>
      <table class="completion"><thead><tr><th>Member</th><th>Status</th><th>Submitted</th><th></th></tr></thead>
        <tbody>${rows.map(line).join("")}${extra.map(line).join("")}</tbody></table>
      ${total === 0 ? `<p class="form-hint" style="margin-top:6px">Nobody is in this form’s audience.</p>` : ""}
    </div>`;
}

// ── Modals ───────────────────────────────────────────────────────────────────

function openModal(html, testid) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal"${testid ? ` data-testid="${testid}"` : ""}>${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  setTimeout(() => modalEl?.querySelector("[data-autofocus]")?.focus(), 50);
}
// `only`: close the dialog only if it is still this one. A save that finishes
// after its dialog was closed and another opened must not close the newer one,
// which would discard its edits and delete its upload.
function closeModal(only) {
  if (only !== undefined && modalEl !== only) return;
  // A question dialog mid-save stays: closing it would delete the upload the
  // save is about to name.
  if (modalEl?.dataset.saving) return;
  // A document uploaded into a question dialog closed without saving is named
  // by no row, and nothing else would ever delete it, so it goes now.
  const stray = modalEl?.dataset.uploadedFileId;
  if (stray && isFileId(stray)) files.delete(stray).catch(() => {});
  modalEl?.remove();
  modalEl = null;
}
const modalHeader = (title) => `<div class="modal-header"><h2>${title}</h2><button class="modal-close" aria-label="Close" data-action="close-modal">${glyph("close", { accent: "currentColor" })}</button></div>`;

function readFormModal() {

    requires_signature: form && form.status !== "draft" ? form.requires_signature : (host.querySelector("#f-sign")?.checked ? 1 : 0),

// A form's settings, written to an existing row. The signature switch and
// statement change only while the form is a draft, decided by the row's
// stored status in the statement itself: a tab that still believes an opened
// form is a draft cannot rewrite what members are signing.
const UPDATE_FORM_SQL =
  `UPDATE app_forms__forms SET title = ?, description = ?, audience_kind = ?, audience_group_id = ?, audience_member_ids = ?, `
  + `requires_signature = CASE WHEN status = 'draft' THEN ? ELSE requires_signature END, `
  + `signature_text = CASE WHEN status = 'draft' THEN ? ELSE signature_text END, due_date = ?, updated_at = ? WHERE id = ?`;
const updateFormParams = (v, now, id) =>
  [v.title, v.description, v.audience_kind, v.audience_group_id, v.audience_member_ids, v.requires_signature, v.signature_text, v.due_date, now, id];

async function saveForm(existingId) {
  const host = modalEl;
  const draft = readFormModal();
  const errEl = host?.querySelector("#modal-error");
  if (draft.error) { if (errEl) errEl.textContent = draft.error; return; }
  const btn = host?.querySelector("[data-action=save-form]");
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  const v = draft.value;
  const now = new Date().toISOString();
  try {
    if (existingId) {
      const { changed } = await db(UPDATE_FORM_SQL, updateFormParams(v, now, existingId));
      if (DB && Number(changed ?? 0) === 0) {
        const still = (await db(`SELECT id FROM app_forms__forms WHERE id = ?`, [existingId])).rows?.length > 0;
        throw userError(failureLine(null, { action: "save the form", thing: "form", found: still }));
      }
      const idx = forms.findIndex(f => f.id === existingId);
      let stored = null;
      if (DB) stored = (await db(`SELECT * FROM app_forms__forms WHERE id = ?`, [existingId]).catch(() => ({ rows: [] }))).rows?.[0] ?? null;
      if (idx !== -1) forms[idx] = stored ?? { ...forms[idx], ...v, updated_at: now };
      // The statement only changes while the form is a draft (the CASE above).
      // A tab that still showed it as one is told, rather than shown a save
      // that quietly kept the old wording.
      if (stored && stored.status !== "draft"
        && (String(stored.signature_text ?? "") !== String(v.signature_text ?? "") || Number(stored.requires_signature) !== Number(v.requires_signature))) {
        toast("Saved. The form is already open, so its signature and statement were not changed.");
      }
    } else {
      const id = host ? (host.dataset.rowId ||= crypto.randomUUID()) : crypto.randomUUID();
      // The row as stored, when this save had to find out what landed.
      let stored = null;
      try {
        await db(
          `INSERT INTO app_forms__forms (id, title, description, status, audience_kind, audience_group_id, audience_member_ids, requires_signature, signature_text, due_date, closes_at, created_by, created_at, updated_at) VALUES (?, ?, ?, 'draft', ?, ?, ?, ?, ?, ?, NULL, ?, ?, ?)`,
          [id, v.title, v.description, v.audience_kind, v.audience_group_id, v.audience_member_ids, v.requires_signature, v.signature_text, v.due_date, ME?.id ?? "demo", now, now],
        );
      } catch (e) {
        if (!outcomeUnknown(e)) throw e;
        if (!(await db(`SELECT id FROM app_forms__forms WHERE id = ?`, [id])).rows?.[0]) throw e;
        // An earlier try of this dialog created the row, and its answer was
        // lost. The dialog may have been edited since: what it shows now is
        // written onto that row, and the list holds the row as stored.
        const { changed } = await db(UPDATE_FORM_SQL, updateFormParams(v, now, id));
        if (Number(changed ?? 0) === 0) throw userError(failureLine(null, { action: "save the form", thing: "form", found: true, guarded: true }));
        stored = (await db(`SELECT * FROM app_forms__forms WHERE id = ?`, [id])).rows?.[0] ?? null;
        if (!stored) throw userError(failureLine(null, { action: "save the form", thing: "form", found: false }));
      }
      forms = [stored ?? { id, ...v, status: "draft", closes_at: null, created_by: ME?.id ?? "demo", created_at: now, updated_at: now, opened_at: null, closed_at: null }, ...forms.filter(f => f.id !== id)];
      if (host) delete host.dataset.rowId;
      closeModal(host);
      currentTab = "drafts";
      await openForm(id);
      return;
    }
    closeModal(host);
    render();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = existingId ? "Save" : "Create draft"; }
    console.error(e);
    if (errEl) errEl.textContent = failureLine(e, { action: "save the form", thing: "form" });
  }
}
